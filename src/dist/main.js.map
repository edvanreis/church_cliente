module.exports = "<div class=\"toolbar-user-container\">\r\n\t<button mat-button (click)=\"isOpen = !isOpen\" class=\"toolbar-user-btn\" [class.open]=\"isOpen\"\r\n\t\t[ngStyle.xs]=\"{'min-width': '70px'}\">\r\n\t\t<span fxLayout=\"row\" fxLayoutAlign=\"start center\">\r\n\t\t\t<!-- <img class=\"avatar\" [src]=\"currentUser?.photoURL || 'assets/images/avatars/noavatar.png'\"> -->\r\n\t\t\t<span class=\"name\" fxShow.gt-xs>{{currentUser}}</span>\r\n\t\t\t<mat-icon class=\"icon\"  fxShow.gt-xs>keyboard_arrow_down</mat-icon>\r\n\t\t</span>\r\n\t</button>\r\n\r\n\t<div class=\"dropdown mat-elevation-z1\" [class.open]=\"isOpen\">\r\n\t\t<div class=\"content\">\r\n\t\t\t<mat-nav-list>\r\n\t\t\t\t<mat-list-item>\r\n\t\t\t\t\t<a matLine (click)=\"logout()\">Logout</a>\r\n\t\t\t\t\t<button mat-icon-button>\r\n\t\t\t\t\t\t<mat-icon>exit_to_app</mat-icon>\r\n\t\t\t\t\t</button>\r\n\t\t\t\t</mat-list-item>\r\n\t\t\t</mat-nav-list>\r\n\t\t</div>\r\n\t</div>\r\n</div>\r\n"
