module.exports = "<div>\r\n  <mat-form-field class=\"full-width-field\">\r\n    <input type=\"text\" placeholder=\"Lição\" aria-label=\"Number\" matInput [formControl]=\"myControl\"\r\n      [matAutocomplete]=\"auto\" [(ngModel)]=\"nomeValue\">\r\n    <mat-autocomplete #auto=\"matAutocomplete\">\r\n      <mat-option *ngFor=\"let option of filtered | async\" [value]=\"option.tema\"\r\n        (onSelectionChange)=\"onSelectionChange($event,option)\">\r\n        {{option.tema}}\r\n      </mat-option>\r\n    </mat-autocomplete>\r\n  </mat-form-field>\r\n</div>\r\n"
