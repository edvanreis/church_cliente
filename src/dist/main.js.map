module.exports = "<div mat-dialog-content>\r\n  <h4 mat-dialog-title>\r\n    <mat-toolbar class=\"cdk-header\">\r\n      <i class=\"material-icons\">settings</i>\r\n      <h1 class=\"mat-headline center-align\">Status</h1>\r\n    </mat-toolbar>\r\n  </h4>\r\n  <div class=\"cdk-container\">\r\n    <form form [formGroup]=\"form\">  \r\n      <div>\r\n        <mat-form-field  class=\"full-width-field\">\r\n          <mat-label>Status</mat-label>\r\n          <mat-select formControlName=\"status\" id=\"status\" (selectionChange)=\"changeStatus($event)\">\r\n            <mat-option *ngFor=\"let item of comboStatus\" [value]=\"item.codigo\" >\r\n              {{item.value}}\r\n            </mat-option>\r\n          </mat-select>\r\n        </mat-form-field>\r\n      </div>\r\n      <div>\r\n        <span style=\"color:gray\" >{{mensagem}}</span>\r\n      </div>\r\n      <div>\r\n      <mat-form-field class=\"full-width-field\">\r\n        <textarea matInput placeholder=\"Observação\" formControlName=\"observacao\" maxlength=\"100\"></textarea>\r\n      </mat-form-field>\r\n    </div>\r\n  </form> \r\n  </div>\r\n  <div mat-dialog-actions align=\"end\">\r\n    <button mat-raised-button color=\"primary\" type=\"submit\" (click)=\"confirmar()\">\r\n      <i class=\"material-icons\">done</i>Confirmar</button>\r\n    <div fxFlex></div>\r\n    <button mat-raised-button color=\"warn\" type=\"submit\" (click)=\"close()\">\r\n      <i class=\"material-icons\">close</i>Fechar</button>\r\n  </div>  \r\n</div>"
