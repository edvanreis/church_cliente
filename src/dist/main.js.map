module.exports = "<div fxLayout=\"column\" class=\"components-container-gt-xs\" [ngClass.xs]=\"'components-container-xs'\" fxLayoutGap=\"20px\">\r\n  <div fxFlex class=\"cdk-component-holder button-component-holder mat-elevation-z4\">\r\n    <mat-toolbar class=\"cdk-header\">\r\n      <span><i class=\"material-icons\">add</i></span>\r\n      <h1 class=\"mat-headline center-align\">Cadastrar Justificativa Ausência</h1>\r\n    </mat-toolbar>\r\n    <div class=\"cdk-container\">\r\n      <form form [formGroup]=\"form\">\r\n      <div>\r\n        <mat-form-field class=\"full-width-field\">\r\n          <mat-label>Justificativas</mat-label>\r\n          <mat-select formControlName=\"justificativas\" id=\"justificativas\">\r\n            <mat-option *ngFor=\"let item of justificativas\" [value]=\"item\" (click)=\"onSelectionClick(item.nome)\">\r\n              {{item.nome}}\r\n            </mat-option>\r\n          </mat-select>\r\n          <mat-error *ngIf=\"!form.controls.justificativas.valid\">Campo Obrigatório</mat-error>\r\n        </mat-form-field>\r\n      </div>\r\n      <mat-form-field class=\"full-width-field\">\r\n        <textarea matInput placeholder=\"Nota/Observação\" formControlName=\"observacao\"></textarea>\r\n      </mat-form-field>\r\n      </form>\r\n      <div>\r\n        <button mat-raised-button color=\"primary\" type=\"submit\" (click)=\"salvar()\">\r\n          <i class=\"material-icons\">save</i>Salvar</button>\r\n        <div fxFlex></div>\r\n        <button mat-raised-button color=\"warn\" type=\"submit\" (click)=\"voltar()\">\r\n          <i class=\"material-icons\">reply</i>Voltar</button>\r\n      </div>\r\n    </div>\r\n  </div>\r\n</div>"
