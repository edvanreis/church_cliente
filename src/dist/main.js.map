module.exports = "<div fxLayout=\"column\" class=\"components-container-gt-xs\" [ngClass.xs]=\"'components-container-xs'\" fxLayoutGap=\"20px\">\r\n  <div fxFlex class=\"cdk-component-holder mat-elevation-z4\">\r\n    <mat-toolbar class=\"cdk-header\">\r\n      <i class=\"material-icons\">search</i>\r\n      <h1 class=\"mat-headline center-align\">Lição</h1>\r\n    </mat-toolbar>\r\n    <div class=\"cdk-container\">\r\n      <div fxLayout=\"row\" fxLayout.lt-sm=\"column\" fxLayoutGap=\"100px\">\r\n        <button mat-raised-button color=\"primary\" type=\"submit\" (click)=\"dialogAdd()\">\r\n          <i class=\"material-icons\">add</i>Novo</button>\r\n      </div>\r\n      <br />\r\n      <br />\r\n      <div  style=\"padding: 0 20px;\">\r\n        <mat-form-field floatPlaceholder=\"never\" style=\"color: black; width: 100%;\">\r\n          <input matInput (keyup)=\"applyFilter($event.target.value)\" placeholder=\"Filtrar\">\r\n        </mat-form-field>\r\n      </div>\r\n      <mat-table #table [dataSource]=\"dados\" matSort style=\"margin-top: 20px;\">\r\n        <ng-container matColumnDef=\"{{ column.id }}\" *ngFor=\"let column of columnNames\">\r\n          <mat-header-cell *matHeaderCellDef mat-sort-header> {{column.value}} </mat-header-cell>\r\n          <mat-cell *matCellDef=\"let element\">\r\n            <span *ngIf=\"column.id!='id'\" matTooltip=\"{{element[column.id]}}\" >\r\n              <!-- {{(element[column.id].length > 20) ? ((element[column.id]).slice(0, 20) + '...') : element[column.id]}} -->\r\n              {{element[column.id]}}\r\n            </span>\r\n            <span *ngIf=\"column.id=='id'\" matTooltip=\"Editar\" style=\"cursor: pointer;color:#1d68a5\" (click)=\"dialogEdit(element.id)\"><i\r\n                class=\"material-icons\">create</i></span>\r\n            <span *ngIf=\"column.id=='id'\" matTooltip=\"Excluir\" style=\"cursor: pointer;color:#1d68a5\" (click)=\"dialogRemove(element.id)\"><i\r\n                class=\"material-icons\">delete_forever</i></span>\r\n          </mat-cell>\r\n        </ng-container>\r\n        <mat-header-row *matHeaderRowDef=\"displayedColumns\"></mat-header-row>\r\n        <mat-row *matRowDef=\"let row; columns: displayedColumns;\"></mat-row>\r\n      </mat-table>\r\n      <mat-paginator #paginator [length]=\"dados.length\" [pageSize]=\"5\" [pageSizeOptions]=\"[5, 10, 20]\"\r\n        showFirstLastButtons></mat-paginator>\r\n        <button mat-raised-button color=\"success\" (click)=\"exportAsXLSX()\" *ngIf=\"licoes.length > 0\"><i\r\n          class=\"material-icons\">vertical_align_bottom</i>Exportar XLSX</button>\r\n    </div>\r\n  </div>\r\n  </div>\r\n"
