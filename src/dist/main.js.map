module.exports = "<div>\r\n  <mat-form-field class=\"full-width-field\">\r\n    <mat-label>Selecione...</mat-label>\r\n    <mat-select [(ngModel)]=\"cargoSelecionado\" id=\"cargo\">\r\n      <mat-option *ngFor=\"let item of cargos$ | async\" [value]=\"item\">\r\n        {{item.nome}}\r\n      </mat-option>\r\n    </mat-select>\r\n  </mat-form-field>\r\n  </div>\r\n<button mat-raised-button color=\"primary\" type=\"submit\" (click)=\"adicionar()\">\r\n  <i class=\"material-icons\">add</i>adicionar</button>\r\n<br />\r\n<br />\r\n<div fxLayout=\"row\" fxLayout.lt-sm=\"column\" fxLayoutGap=\"20px\" *ngIf=\"cargos.length > 0\" style=\"overflow: auto; height: 200px;\">\r\n<div class=\"table-responsive\">\r\n  <table>\r\n    <thead class=\"text-primary\">\r\n      <th></th>\r\n      <th>Cargo</th>\r\n      <th>Remover</th>\r\n    </thead>\r\n    <tbody>\r\n      <tr *ngFor=\"let c of cargos;let i = index\">\r\n        <td>{{ i+1 }}</td>\r\n        <td>{{ c.nome}}</td>\r\n        <td><span style=\"color: #1d68a5;cursor: pointer\" (click)=\"dialogRemover(i,c)\"><i\r\n              class=\"material-icons\">delete</i></span></td>\r\n      </tr>\r\n    </tbody>\r\n  </table>\r\n</div>\r\n</div>\r\n"
