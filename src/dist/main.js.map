module.exports = "<div mat-dialog-content>\r\n  <h4 mat-dialog-title>\r\n    <mat-toolbar class=\"cdk-header\">\r\n      <i class=\"material-icons\">{{icon}}</i>\r\n      <h1 class=\"mat-headline center-align\">{{titulo}}</h1>\r\n    </mat-toolbar>\r\n  </h4>\r\n  <div class=\"cdk-container\">\r\n      <div>\r\n        <span style=\"color:gray\" >{{mensagem}}</span>\r\n      </div>\r\n      <div *ngIf=\"data.reprovar\">\r\n      <mat-form-field class=\"full-width-field\">\r\n        <textarea matInput placeholder=\"Observação\" [(ngModel)]=\"observacao\" maxlength=\"100\"></textarea>\r\n      </mat-form-field>\r\n    </div>\r\n  </div>\r\n  <div mat-dialog-actions align=\"end\">\r\n    <button mat-raised-button color=\"primary\" type=\"submit\" (click)=\"confirmar()\">\r\n      <i class=\"material-icons\">done</i>Confirmar</button>\r\n    <div fxFlex></div>\r\n    <button mat-raised-button color=\"warn\" type=\"submit\" (click)=\"close()\">\r\n      <i class=\"material-icons\">close</i>Fechar</button>\r\n  </div>\r\n</div>\r\n"
