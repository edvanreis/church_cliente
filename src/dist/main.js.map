module.exports = "<div fxLayout=\"column\" class=\"components-container-gt-xs\" [ngClass.xs]=\"'components-container-xs'\" fxLayoutGap=\"20px\">\r\n  <div fxFlex class=\"cdk-component-holder button-component-holder mat-elevation-z4\">\r\n    <mat-toolbar class=\"cdk-header\">\r\n      <span><i class=\"material-icons\">add</i></span>\r\n      <h1 class=\"mat-headline center-align\">Permissão</h1>\r\n    </mat-toolbar>\r\n    <div class=\"cdk-container\">\r\n      <div fxFlex.xs=\"100\" fxFlex.lg=\"100\" fxFlex.md=\"100\" fxFlex.sm=\"100\">\r\n        <form form [formGroup]=\"form\">\r\n          <div>\r\n            <mat-form-field class=\"full-width-field\">\r\n              <input matInput placeholder=\"Nome\" formControlName=\"nome\" id=\"nome\">\r\n              <mat-error *ngIf=\"!form.controls.nome.valid\">Campo Obrigatório</mat-error>\r\n            </mat-form-field>\r\n          </div>\r\n          <div>\r\n            <mat-form-field class=\"full-width-field\">\r\n              <textarea matInput placeholder=\"Descrição\" formControlName=\"descricao\"></textarea>\r\n              <mat-error *ngIf=\"!form.controls.descricao.valid\">Campo Obrigatório</mat-error>\r\n            </mat-form-field>\r\n          </div>\r\n          <br />\r\n          <br />\r\n          <div>\r\n            <button mat-raised-button color=\"primary\" type=\"submit\" (click)=\"saveOrEdit()\">\r\n              <i class=\"material-icons\">save</i>Salvar</button>\r\n            <div fxFlex></div>\r\n            <button mat-raised-button color=\"warn\" type=\"submit\" (click)=\"voltar()\">\r\n              <i class=\"material-icons\">reply</i>Voltar</button>\r\n          </div>\r\n        </form>\r\n      </div>\r\n    </div>\r\n  </div>\r\n</div>\r\n"
