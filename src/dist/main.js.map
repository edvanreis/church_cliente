module.exports = "<div mat-dialog-content>\r\n  <h4 mat-dialog-title>\r\n    <mat-toolbar class=\"cdk-header\">\r\n      <i class=\"material-icons\">add</i>\r\n      <h1 class=\"mat-headline center-align\">Lição</h1>\r\n    </mat-toolbar>\r\n  </h4>\r\n  <div class=\"cdk-container\">\r\n      <mat-form-field class=\"full-width-field\">\r\n        <textarea matInput placeholder=\"Tema\" [(ngModel)]=\"tema\" style=\"text-transform: uppercase;\"></textarea>\r\n      </mat-form-field>\r\n  </div>\r\n  <div mat-dialog-actions align=\"end\">\r\n    <button mat-raised-button color=\"primary\" type=\"submit\" (click)=\"salvar()\">\r\n      <i class=\"material-icons\">done</i>Salvar</button>\r\n    <div fxFlex></div>\r\n    <button mat-raised-button color=\"warn\" type=\"submit\" (click)=\"close()\">\r\n      <i class=\"material-icons\">close</i>Fechar</button>\r\n  </div>\r\n</div>\r\n"
