module.exports = "<mat-nav-list [style.maxHeight]=\"(menu.open)?'1200px':'48px'\"  [ngClass]=\"{'secondaryMenu': secondaryMenu, 'primary': !secondaryMenu}\">\r\n    <mat-list-item *ngIf = \"menu.link==false && menu?.visible\" (click)=\"menu.open = !menu.open\" >\r\n        <mat-icon matListIcon iconsmall  >{{menu.icon}} </mat-icon>\r\n        <h3 matLine *ngIf=\"!iconOnly\">{{ menu.name }} </h3>\r\n        <mat-chip-list *ngIf=\"menu?.chip && !iconOnly && menu?.visible\">\r\n            <mat-chip >{{menu?.chip?.value}} </mat-chip>\r\n        </mat-chip-list>        \r\n        <mat-icon *ngIf=\"chechForChildMenu()\" class=\"sidenav-dropdown-indicator rotate \" [ngClass]=\"{'indicateOpen':menu.open}\"> expand_more</mat-icon>\r\n    </mat-list-item>\r\n\r\n    <mat-list-item *ngIf = \"menu.link!=false && menu?.visible\" (click)=\"menu.open = !menu.open\" [routerLink]=\"[menu.link]\">\r\n    \t<mat-icon matListIcon iconsmall  >{{menu.icon}} </mat-icon>\r\n        <h3 matLine *ngIf=\"!iconOnly\">{{ menu.name }} </h3>\r\n    </mat-list-item>\r\n\r\n    <cdk-sidemenu-item *ngFor=\"let submenu of menu?.sub\" [menu]=\"submenu\" [iconOnly]=\"iconOnly\" [secondaryMenu]=\"true\"> </cdk-sidemenu-item>\r\n\r\n</mat-nav-list>\r\n"
