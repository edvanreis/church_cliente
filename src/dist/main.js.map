module.exports = "<div  class=\"round-progressbar mat-elevation-z4 \"  fxLayout=\"column\" [style.background]=\"boxcolor\">\r\n    <h1 class=\"mat-headline header\">\r\n            {{title}}\r\n    </h1>\r\n    <div  fxLayout=\"row\" >\r\n\r\n        <div fxFlex=\"10\">\r\n        </div>\r\n        <div fxFlex=\"80\" >\r\n              <div class=\"progress-wrapper\">\r\n                    <div class=\"current mat-headline \" [ngStyle]=\"getOverlayStyle()\">{{ current }}/{{ max }}</div>\r\n                    <round-progress  [current]=\"current\"\r\n                    [max]=\"max\"\r\n                    [color]=\"color\"\r\n                    [background]=\"background\"\r\n                    [radius]=\"125\"\r\n                    [stroke]=\"30\"\r\n                    [semicircle]=\"semicircle\"\r\n                    [rounded]=\"rounded\"\r\n                    [clockwise]=\"clockwise\"\r\n                    [responsive]=\"responsive\"\r\n                    [duration]=\"800\"\r\n                    [animation]=\"animation\"\r\n                    [animationDelay]=\"1\"\r\n                     ></round-progress>\r\n              </div>\r\n           \r\n        </div>\r\n        <div  fxFlex=\"10\"></div>\r\n    </div>\r\n\r\n</div>"
