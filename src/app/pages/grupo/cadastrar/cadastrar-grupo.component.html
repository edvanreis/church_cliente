<div fxLayout="column" class="components-container-gt-xs" [ngClass.xs]="'components-container-xs'" fxLayoutGap="20px">
  <div fxFlex class="cdk-component-holder button-component-holder mat-elevation-z4">
    <mat-toolbar class="cdk-header">
      <span><i class="material-icons">add</i></span>
      <h1 class="mat-headline center-align">Grupo de Trabalho</h1>
    </mat-toolbar>
    <div class="cdk-container">
      <mat-tab-group>
        <mat-tab label="Grupo de Trabalho">
          <form form [formGroup]="form">
            <div>
              <mat-form-field class="full-width-field">
                <input matInput placeholder="Nome"  formControlName="nome" id="nome" required>
                <mat-error *ngIf="!form.controls.nome.valid">Campo Obrigatório</mat-error>
              </mat-form-field>
            </div>
            <div>
              <mat-form-field class="full-width-field">
                <mat-label>Tipo de Grupos de Trabalho</mat-label>
                <mat-select id="tipo" formControlName="tipo">
                  <mat-option *ngFor="let item of tipoGrupo$| async" [value]="item" (click)="onSelectionClick(item)">
                    {{item.nome}}
                  </mat-option>
                </mat-select>
                <mat-error *ngIf="!form.controls.tipo.valid">Campo Obrigatório</mat-error>
              </mat-form-field>
            </div>
            <div>
              <mat-form-field class="full-width-field">
                <textarea matInput placeholder="Descrição" formControlName="descricao"></textarea>
                <mat-error *ngIf="!form.controls.descricao.valid">Campo Obrigatório</mat-error>
              </mat-form-field>
            </div>
           </form> 
           <app-igrejas></app-igrejas>
        </mat-tab>
        <mat-tab label="Sub Grupo de Trabalho">

        </mat-tab>
      </mat-tab-group>
    </div>
  </div>
</div>
