<div fxLayout="column" class="components-container-gt-xs" [ngClass.xs]="'components-container-xs'" fxLayoutGap="20px">
  <div fxFlex class="cdk-component-holder button-component-holder mat-elevation-z4">
    <mat-toolbar class="cdk-header">
      <span><i class="material-icons">add</i></span>
      <h1 class="mat-headline center-align">Parametros</h1>
    </mat-toolbar>
    <div class="cdk-container">
      <form form [formGroup]="form">
        <div>
        <mat-form-field class="full-width-field">
          <mat-label>Tipo Parametro</mat-label>
          <mat-select formControlName="tipo" id="tipo">
            <mat-option *ngFor="let item of comboTipoParametro | keyValue" [value]="item.key">
              {{item.key}}
            </mat-option>
          </mat-select>
          <mat-error *ngIf="!form.controls.tipo.valid">Campo Obrigatório</mat-error>
        </mat-form-field>
      </div>
      <div>
        <mat-form-field class="full-width-field">
          <input matInput placeholder="Email" formControlName="email" type="email">
          <mat-error *ngIf="!form.controls.email.valid" required>Campo Obrigatório</mat-error>
        </mat-form-field>
      </div>
      <div>
        <mat-form-field class="full-width-field">
            <input type="password"  class="input" placeholder="Senha"
            formControlName="senha" required matInput>
          <mat-error *ngIf="!form.controls.senha.valid">Campo Obrigatório</mat-error>
        </mat-form-field>
      </div>
      <div>
        <mat-form-field class="full-width-field">
          <textarea matInput placeholder="Descrição" formControlName="descricao" required></textarea>
          <mat-error *ngIf="!form.controls.descricao.valid">Campo Obrigatório</mat-error>
        </mat-form-field>
      </div>
     </form>
     <div>
      <button mat-raised-button color="primary" type="submit" (click)="salvar()">
        <i class="material-icons">save</i>Salvar</button>
      <div fxFlex></div>
      <button mat-raised-button color="warn" type="submit" (click)="voltar()">
        <i class="material-icons">reply</i>Voltar</button>
    </div>
    </div>
  </div>
</div>
