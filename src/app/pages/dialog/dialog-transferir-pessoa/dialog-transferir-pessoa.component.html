<div mat-dialog-content>
  <h4 mat-dialog-title>
    <mat-toolbar class="cdk-header">
      <i class="material-icons">swap_horiz</i>
      <h1 class="mat-headline center-align">Transferir</h1>
    </mat-toolbar>
  </h4>
  <div class="cdk-container">
  <app-igrejas *ngIf="data.controller==='igreja'"></app-igrejas>
    <div *ngIf="data.controller==='rede'">
      <mat-form-field class="full-width-field">
        <input type="text" placeholder="Rede" aria-label="Number" matInput [formControl]="myControlRede"
          [matAutocomplete]="a" [(ngModel)]="redeValue">
        <mat-autocomplete #a="matAutocomplete">
          <mat-option *ngFor="let option of filteredRede | async" [value]="option.nome"
            (click)="onSelectionRedeClick($event,option)">
            {{option.nome}}
          </mat-option>
        </mat-autocomplete>
      </mat-form-field>
    </div>
    <div *ngIf="data.controller==='celula'">
      <mat-form-field class="full-width-field">
        <input type="text" placeholder="Celula" aria-label="Number" matInput [formControl]="myControlCelula"
          [matAutocomplete]="auto" [(ngModel)]="celulaValue">
        <mat-autocomplete #auto="matAutocomplete">
          <mat-option *ngFor="let option of filteredCelula | async" [value]="option.nome"
            (onSelectionChange)="onSelectionCelulaClick($event,option)">
            {{option.nome}}
          </mat-option>
        </mat-autocomplete>
      </mat-form-field>
    </div>
  </div>
  <div mat-dialog-actions align="end">
    <button mat-raised-button color="primary" type="submit" (click)="confirmar()">
      <i class="material-icons">done</i>Confirmar</button>
    <div fxFlex></div>
    <button mat-raised-button color="warn" type="submit" (click)="close()">
      <i class="material-icons">close</i>Fechar</button>
  </div>
</div>
