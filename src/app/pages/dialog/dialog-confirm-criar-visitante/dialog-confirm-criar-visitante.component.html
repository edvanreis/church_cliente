<div mat-dialog-content>
  <h4 mat-dialog-title>
    <mat-toolbar class="cdk-header">
      <i class="material-icons">person</i>
      <h1 class="mat-headline center-align">Visitante</h1>
    </mat-toolbar>
  </h4>
  <div class="cdk-container">
    <div mat-dialog-content>
      <div>
        <span style="color:gray">Deseja Realmente cadastrar este visitante?</span>
      </div>
      <div *ngIf="dados.data.length > 0">
        <mat-form-field class="full-width-field">
          <input matInput (keyup)="applyFilter($event.target.value)" placeholder="Filtrar">
        </mat-form-field>
        <mat-table #table [dataSource]="dados" #sort="matSort" matSort>
          <ng-container matColumnDef="{{ column.id }}" *ngFor="let column of columnNames">
            <mat-header-cell *matHeaderCellDef> {{column.value}} </mat-header-cell>
            <mat-cell *matCellDef="let element">
              <span  *ngIf="column.id!='id'"  matTooltip="{{element[column.id]}}">
                {{(element[column.id]?.length > 15) ? ((element[column.id])?.slice(0, 15) + '...') : element[column.id]}}
                <!-- {{element[column.id]}} -->
              </span>
              <span matTooltip="Transferir" *ngIf="column.id=='id'" class="default-botoes" (click)="transferir(element.id)">
                <i class="material-icons">swap_horiz</i>
              </span>
            </mat-cell>
          </ng-container>
          <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
          <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
        </mat-table>
        <mat-paginator [length]="dados.data.length" #paginator [pageSize]="5" [pageSizeOptions]="[5, 10, 20]"
          showFirstLastButtons></mat-paginator>
      </div>
    </div>
    <div mat-dialog-actions align="end">
      <button mat-raised-button color="primary" type="submit" (click)="confirmar()">
        <i class="material-icons">done</i>Confirmar</button>
        <div fxFlex></div>
      <button mat-raised-button color="warn" type="submit" (click)="close()">
        <i class="material-icons">close</i>Fechar</button>
    </div>
  </div>
