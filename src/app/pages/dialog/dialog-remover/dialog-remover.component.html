<div mat-dialog-content>
  <h4 mat-dialog-title>
    <mat-toolbar class="input-header">
      <i class="material-icons">delete_outline</i>
      <h1 class="mat-headline center-align">Remover</h1>
    </mat-toolbar>
  </h4>
  <div class="input-container">
    <div fxFlex.xs="100" fxFlex.lg="50" fxFlex.md="50" fxFlex.sm="50">
      <span>Deseja Realmente remover este item?</span>
    </div>
  </div>
  <div mat-dialog-actions align="end">
    <button mat-raised-button color="primary" type="submit" (click)="remove()">
      <i class="material-icons">delete_forever</i>Remover</button>
    <div fxFlex></div>
    <button mat-raised-button color="accent" type="submit" (click)="close()">
      <i class="material-icons">close</i>Fechar</button>
  </div>
</div>
