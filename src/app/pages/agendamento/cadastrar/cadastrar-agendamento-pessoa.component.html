<div fxLayout="column" class="components-container-gt-xs" [ngClass.xs]="'components-container-xs'" fxLayoutGap="20px">
  <div fxFlex class="cdk-component-holder button-component-holder mat-elevation-z4">
    <mat-toolbar class="cdk-header">
      <span><i class="material-icons">wysiwyg</i></span>
      <h1 class="mat-headline center-align">Agendamento</h1>
    </mat-toolbar>
    <div class="cdk-container">
      <form form [formGroup]="form">
        <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="20px">
          <mat-form-field class="full-width-field">
            <input matInput class="input-upper" placeholder="Nome" formControlName="nome" id="nome">
            <mat-error *ngIf="!form.controls.nome.valid">Campo Obrigatório</mat-error>
          </mat-form-field>
        </div>
        <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="20px">
          <mat-form-field class="full-width-field">
            <input matInput class="input-upper" placeholder="Sobre Nome" formControlName="sobreNome" id="sobreNome">
            <mat-error *ngIf="!form.controls.sobreNome.valid">Campo Obrigatório</mat-error>
          </mat-form-field>
        </div>
        <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="20px">
          <mat-form-field class="full-width-field">
            <input matInput  placeholder="E-mail" formControlName="email" id="email">
          </mat-form-field>
          <mat-form-field class="full-width-field">
            <input matInput placeholder="Céluar" formControlName="celular" [textMask]="{mask: maskCelular}"
              id="celular">
          </mat-form-field>
        </div>
        <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="20px">
          <mat-form-field class="full-width-field">
            <input matInput [textMask]="{mask: maskDate}" placeholder="Data nascimento"
              formControlName="dataNascimento">
            <mat-error *ngIf="!form.controls.dataNascimento.valid">Campo Obrigatório</mat-error>
          </mat-form-field>
          <mat-form-field class="full-width-field">
            <input matInput placeholder="CPF" [textMask]="{mask: maskCPF}" formControlName="cpf" id="cpf">
            <mat-error *ngIf="!form.controls.cpf.valid">Campo Obrigatório</mat-error>
          </mat-form-field>
        </div>
        <app-igrejas></app-igrejas>
        <div>
          <mat-form-field class="full-width-field">
            <input type="text" placeholder="Agendamentos" aria-label="Number" matInput [formControl]="myControlAgendamento"
              [matAutocomplete]="auto"  style="width: 100%;" [(ngModel)]="agendamentoValue">
            <mat-autocomplete #auto="matAutocomplete">
              <mat-option *ngFor="let option of filteredAgendamento | async" [value]="option.dataTipoDeCulto"
                (onSelectionChange)="onSelectionChange($event,option)">
                {{option.dataTipoDeCulto}}
              </mat-option>
            </mat-autocomplete>
          </mat-form-field>
        </div>
      </form>
      <div>
        <button mat-raised-button color="primary" type="submit" (click)="salvar()">
          <i class="material-icons">save</i>Salvar</button>
      </div>
    </div>
  </div>
</div>
