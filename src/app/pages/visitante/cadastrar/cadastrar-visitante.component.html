<div fxLayout="column" class="components-container-gt-xs" [ngClass.xs]="'components-container-xs'" fxLayoutGap="20px">
  <div fxFlex class="cdk-component-holder button-component-holder mat-elevation-z4">
    <mat-toolbar class="cdk-header">
      <i class="material-icons">person_add</i>
      <h1 class="mat-headline center-align">Cadastrar</h1>
    </mat-toolbar>
    <div class="cdk-container">
      <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="20px" class="default-font-color">
        <i class="material-icons">face</i>
        <h1 class="mat-subheading-2 center-align">Dados Pessoais</h1>
      </div>
      <form form [formGroup]="form">
        <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="20px">
          <mat-form-field class="full-width-field">
            <input matInput class="input-upper" placeholder="Nome" formControlName="nome" id="nome">
            <mat-error *ngIf="!form.controls.nome.valid">Campo Obrigatório</mat-error>
          </mat-form-field>
        </div>
        <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="20px">
          <mat-form-field class="full-width-field">
            <input matInput class="input-upper" placeholder="Sobre Nome" formControlName="sobrenome" id="sobrenome">
          </mat-form-field>
        </div>
        <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="20px">
          <mat-form-field class="full-width-field">
            <input matInput [textMask]="{mask: maskDate}" placeholder="Data nascimento"
              formControlName="dataNascimento">
          </mat-form-field>
          <mat-form-field class="full-width-field">
            <mat-label>Sexo</mat-label>
            <mat-select formControlName="sexo" id="sexo">
              <mat-option *ngFor="let item of comboSexo | keyValue" [value]="item.key">
                {{item.value}}
              </mat-option>
            </mat-select>
          </mat-form-field>
        </div>
        <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="20px">
          <mat-form-field class="full-width-field">
            <mat-label>Estado Civil</mat-label>
            <mat-select formControlName="estadoCivil" id="estadoCivil">
              <mat-option *ngFor="let item of comboEstadoCivil | keyValue" [value]="item.key">
                {{item.value}}
              </mat-option>
            </mat-select>
          </mat-form-field>
          <mat-form-field class="full-width-field">
            <input matInput class="input-upper" placeholder="Nacionalidade" formControlName="nacionalidade"
              id="nacionalidade">
          </mat-form-field>
        </div>
      <app-igrejas></app-igrejas>
      <div>
        <mat-form-field class="full-width-field">
          <input matInput [textMask]="{mask: maskDate}" placeholder="Data do Culto Igreja"
            formControlName="dataCultoIgreja">
        </mat-form-field>
      </div>
      <div>
        <mat-form-field class="full-width-field">
          <input type="text" placeholder="Rede" aria-label="Number" matInput [formControl]="myControlRede"
            [matAutocomplete]="auto" [(ngModel)]="redeValue">
          <mat-autocomplete #auto="matAutocomplete">
            <mat-option *ngFor="let option of filteredRede | async" [value]="option.nome"
              (onSelectionChange)="onSelectionRedeChange($event,option)">
              {{option.nome}}
            </mat-option>
          </mat-autocomplete>
        </mat-form-field>
      </div>
      <div>
        <mat-form-field class="full-width-field">
          <input matInput [textMask]="{mask: maskDate}" placeholder="Data do Culto Rede"
            formControlName="dataCultoRede">
        </mat-form-field>
      </div>
      <div *ngIf="visaoCelular">
        <mat-form-field class="full-width-field">
          <input type="text" placeholder="Celula" aria-label="Number" matInput [formControl]="myControlCelula"
            [matAutocomplete]="aut" [(ngModel)]="celulaValue">
          <mat-autocomplete #aut="matAutocomplete">
            <mat-option *ngFor="let option of filteredCelula | async" [value]="option.nome"
              (onSelectionChange)="onSelectionCelulaChange($event,option)">
              {{option.nome}}
            </mat-option>
          </mat-autocomplete>
        </mat-form-field>
      </div>
      <div *ngIf="visaoCelular">
        <mat-form-field class="full-width-field">
          <input matInput [textMask]="{mask: maskDate}" placeholder="Data da Reunião da Célula"
            formControlName="dataReuniaoCelula">
        </mat-form-field>
      </div>
    </form>
      <mat-divider></mat-divider>
      <br />
      <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="20px" class="default-font-color">
        <i class="material-icons">headset_mic</i>
        <h1 class="mat-subheading-2 center-align">Contatos</h1>
      </div>
      <app-contatos [visitanteId]="id" [associadoId]="id" [principal]="false"></app-contatos>
      <br />
      <br />
    </div>
    <div style="padding: 0 20px;">
      <button mat-raised-button color="primary" type="submit" (click)="salvar()">
        <i class="material-icons">save</i>Salvar</button>
      <div fxFlex></div>
      <button mat-raised-button color="warn" type="submit" (click)="voltar()">
        <i class="material-icons">reply</i>Voltar</button>
    </div>
    <br />
    <br />
  </div>
</div>
