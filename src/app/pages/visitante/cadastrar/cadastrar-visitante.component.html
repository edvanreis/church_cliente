<div fxLayout="column" class="components-container-gt-xs" [ngClass.xs]="'components-container-xs'" fxLayoutGap="20px">
  <div fxFlex class="cdk-component-holder button-component-holder mat-elevation-z4">
    <mat-toolbar class="cdk-header">
      <i class="material-icons">person_add</i>
      <h1 class="mat-headline center-align">Cadastrar</h1>
    </mat-toolbar>
    <div class="cdk-container">
      <div fxFlex.xs="100" fxFlex.lg="50" fxFlex.md="50" fxFlex.sm="50">
        <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="20px" style="color:#1d68a5">
          <i class="material-icons">face</i>
          <h1 class="mat-subheading-2 center-align">Dados Pessoais</h1>
        </div>
        <app-dados-pessoais></app-dados-pessoais>
        <br />
        <br />
        <mat-divider></mat-divider>
        <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="20px" style="color:#1d68a5">
          <i class="material-icons">store_mall_directory</i>
          <h1 class="mat-subheading-2 center-align">Endereço</h1>
        </div>
        <app-endereco></app-endereco>
        <button mat-raised-button color="primary" type="submit" (click)="adicionar()">
          <i class="material-icons">add</i>adicionar</button>
        <br /><br />
        <br />
        <br />
        <mat-divider></mat-divider>
        <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="20px" style="color:#1d68a5">
          <i class="material-icons">headset_mic</i>
          <h1 class="mat-subheading-2 center-align">Contatos</h1>
        </div>
          <app-contatos></app-contatos>0
          <mat-divider></mat-divider>
          <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="20px" style="color:#1d68a5">
            <i class="material-icons">school</i>
            <h1 class="mat-subheading-2 center-align">Escolaridade</h1>
          </div>
          <app-escolaridade></app-escolaridade>
          <button mat-raised-button color="primary" type="submit" (click)="salvar()">
            <i class="material-icons">save</i>Salvar</button>

      </div>
    </div>
  </div>
</div>
