<div fxLayout="column" class="components-container-gt-xs" [ngClass.xs]="'components-container-xs'" fxLayoutGap="20px">
  <div fxFlex class="cdk-component-holder button-component-holder mat-elevation-z4">
    <mat-toolbar class="cdk-header">
      <i class="material-icons">swap_horiz</i>
      <h1 class="mat-headline center-align">Transferir</h1>
    </mat-toolbar>
    <div class="cdk-container">
      <form form [formGroup]="form">
        <app-igrejas></app-igrejas>
        <div>
          <mat-form-field class="full-width-field">
            <input matInput [textMask]="{mask: maskDate}" placeholder="Data do Culto Igreja"
              formControlName="dataCultoIgreja">
          </mat-form-field>
        </div>
        <div>
          <mat-form-field class="full-width-field">
            <input type="text" placeholder="Rede" aria-label="Number" matInput [formControl]="myControlRede"
              [matAutocomplete]="auto" [(ngModel)]="redeValue">
            <mat-autocomplete #auto="matAutocomplete">
              <mat-option *ngFor="let option of filteredRede | async" [value]="option.nome"
                (onSelectionChange)="onSelectionRedeChange($event,option)">
                {{option.nome}}
              </mat-option>
            </mat-autocomplete>
          </mat-form-field>
        </div>
        <div>
          <mat-form-field class="full-width-field">
            <input matInput [textMask]="{mask: maskDate}" placeholder="Data do Culto Rede"
              formControlName="dataCultoRede">
          </mat-form-field>
        </div>
        <div *ngIf="visaoCelular">
          <mat-form-field class="full-width-field">
            <input type="text" placeholder="Celula" aria-label="Number" matInput [formControl]="myControlCelula"
              [matAutocomplete]="aut" [(ngModel)]="celulaValue">
            <mat-autocomplete #aut="matAutocomplete">
              <mat-option *ngFor="let option of filteredCelula | async" [value]="option.nome"
                (onSelectionChange)="onSelectionCelulaChange($event,option)">
                {{option.nome}}
              </mat-option>
            </mat-autocomplete>
          </mat-form-field>
        </div>
        <div *ngIf="visaoCelular">
          <mat-form-field class="full-width-field">
            <input matInput [textMask]="{mask: maskDate}" placeholder="Data da Reunião da Célula"
              formControlName="dataReuniaoCelula">
          </mat-form-field>
        </div>
      </form>
      <div>
        <button mat-raised-button color="primary" type="submit" (click)="salvar()">
          <i class="material-icons">save</i>Salvar</button>
        <div fxFlex></div>
        <button mat-raised-button color="warn" type="submit" (click)="voltar()">
          <i class="material-icons">reply</i>Voltar</button>
      </div>
    </div>
  </div>
</div>
