<div fxLayout="column" class="components-container-gt-xs" [ngClass.xs]="'components-container-xs'" fxLayoutGap="20px">
  <div fxFlex class="input-component-holder button-component-holder mat-elevation-z4">
    <mat-toolbar class="input-header">
      <span *ngIf="titulo=='Editar'"><i class="material-icons">create</i></span>
      <span *ngIf="titulo=='Novo'"><i class="material-icons">add</i></span>
      <h1 class="mat-headline center-align">{{ titulo }} Permissão</h1>
    </mat-toolbar>
    <div class="input-container">
      <div fxFlex.xs="100" fxFlex.lg="100" fxFlex.md="100" fxFlex.sm="100">
        <form form [formGroup]="form">
          <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="20px">
            <mat-form-field class="example-full-width">
              <input matInput placeholder="Nome" formControlName="nome" id="nome">
              <mat-error *ngIf="!form.controls.nome.valid">Campo Obrigatório</mat-error>
            </mat-form-field>
          </div>
          <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="20px">
            <mat-form-field class="example-full-width">
              <textarea matInput placeholder="Descrição" formControlName="descricao"></textarea>
              <mat-error *ngIf="!form.controls.descricao.valid">Campo Obrigatório</mat-error>
            </mat-form-field>
          </div>
          <br />
          <br />
          <div>
            <button mat-raised-button color="primary" type="submit" (click)="saveOrEdit()">
              <i class="material-icons">save</i>Salvar</button>
            <div fxFlex></div>
            <button mat-raised-button color="accent" type="submit" (click)="voltar()">
              <i class="material-icons">reply</i>Voltar</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
