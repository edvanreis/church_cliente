<div fxLayout="column" class="components-container-gt-xs" [ngClass.xs]="'components-container-xs'" fxLayoutGap="20px">
  <div fxFlex class="cdk-component-holder mat-elevation-z4">
    <mat-toolbar class="cdk-header">
      <i class="material-icons">search</i>
      <h1 class="mat-headline center-align">Pedidos de Oração</h1>
    </mat-toolbar>
    <div class="cdk-container">
      <div>
        <mat-form-field class="full-width-field">
          <input type="text" placeholder="Igreja" aria-label="Number" matInput [formControl]="myControlIgreja"
            [matAutocomplete]="auto" [(ngModel)]="igrejaValue" style="width: 100%;">
          <mat-autocomplete #auto="matAutocomplete">
            <mat-option *ngFor="let option of filteredIgreja | async" [value]="option.nome"
              (onSelectionChange)="onSelectionChange($event,option)">
              {{option.nome}}
            </mat-option>
          </mat-autocomplete>
        </mat-form-field>
      <div>
      <div>
        <mat-form-field class="full-width-field">
          <mat-label>Mês e Ano</mat-label>
          <input matInput [matDatepicker]="dp" [formControl]="date"  readonly required>
          <mat-datepicker-toggle matSuffix [for]="dp"></mat-datepicker-toggle>
          <mat-datepicker #dp startView="multi-year" (yearSelected)="chosenYearHandler($event)"
            (monthSelected)="chosenMonthHandler($event, dp)" panelClass="example-month-picker">
          </mat-datepicker>
        </mat-form-field>
      </div>
    </div>
  </div>
</div>
