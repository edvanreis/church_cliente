<div fxLayout="column" class="components-container-gt-xs" [ngClass.xs]="'components-container-xs'" fxLayoutGap="20px">
  <div fxFlex class="cdk-component-holder button-component-holder mat-elevation-z4">
    <mat-toolbar class="cdk-header">
      <span><i class="material-icons">headset_mic</i></span>
      <h1 class="mat-headline center-align">Pedido de Oração</h1>
    </mat-toolbar>
    <div class="cdk-container">
      <form form [formGroup]="form">
        <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="20px">
          <mat-form-field class="full-width-field">
            <input matInput class="input-upper" placeholder="Nome Completo" formControlName="pessoaNome" id="pessoaNome"
              required>
            <mat-error *ngIf="!form.controls.pessoaNome.valid">Campo Obrigatório</mat-error>
          </mat-form-field>
        </div>
        <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="20px">
          <mat-form-field class="full-width-field">
            <input matInput  placeholder="E-mail" formControlName="email" id="email">
          </mat-form-field>
          <mat-form-field class="full-width-field">
            <input matInput placeholder="Céluar" formControlName="celular" [textMask]="{mask: maskCelular}"
              id="celular">
          </mat-form-field>
        </div>
        <app-igrejas></app-igrejas>
        <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="20px">
          <mat-form-field class="full-width-field">
            <input matInput class="input-upper" placeholder="Cidade" formControlName="logradouro" id="logradouro">
          </mat-form-field>
          <mat-form-field>
            <mat-label>Estado</mat-label>
            <mat-select formControlName="uf" id="uf">
              <mat-option *ngFor="let item of comboEstados | keyValue" [value]="item.key">
                {{item.value}}
              </mat-option>
            </mat-select>
          </mat-form-field>
        </div>
        <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="20px">
          <mat-form-field class="full-width-field">
            <mat-label>Area</mat-label>
            <mat-select formControlName="area" id="area">
              <mat-option *ngFor="let item of comboAreaOracao | keyValue" [value]="item.key">
                {{item.value}}
              </mat-option>
            </mat-select>
            <mat-error *ngIf="!form.controls.area.valid">Campo Obrigatório</mat-error>
          </mat-form-field>
        </div>
        <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="20px">
          <mat-form-field class="full-width-field">
            <textarea matInput placeholder="Escreva seu pedido de oração" formControlName="descricao" maxlength="500" required></textarea>
            <mat-error *ngIf="!form.controls.descricao.valid">Campo Obrigatório</mat-error>
          </mat-form-field>
        </div>
      </form>
      <br />
      <br />
      <div>
        <button mat-raised-button color="primary" type="submit" (click)="salvar()">
          <i class="material-icons">vertical_align_top</i>Enviar</button>
      </div>
    </div>
  </div>
</div>
