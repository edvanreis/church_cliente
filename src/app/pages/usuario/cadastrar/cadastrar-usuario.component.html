<div fxLayout="column" class="components-container-gt-xs" [ngClass.xs]="'components-container-xs'" fxLayoutGap="20px">
  <div fxFlex class="cdk-component-holder button-component-holder mat-elevation-z4">
    <mat-toolbar class="cdk-header">
      <span *ngIf="titulo=='Editar'"><i class="material-icons">create</i></span>
      <span *ngIf="titulo=='Novo'"><i class="material-icons">add</i></span>
      <h1 class="mat-headline center-align">{{ titulo }} Usuario</h1>
    </mat-toolbar>
    <div class="cdk-container">
      <div fxFlex.xs="100" fxFlex.lg="100" fxFlex.md="100" fxFlex.sm="100">
        <form form [formGroup]="form">
          <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="20px">
            <mat-form-field class="example-full-width">
              <input matInput placeholder="login" formControlName="login" id="login">
              <mat-error *ngIf="!form.controls.login.valid">Campo Obrigatório</mat-error>
            </mat-form-field>
          </div>
          <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="20px">
            <mat-form-field class="example-full-width">
              <input type="text" placeholder="Membro" aria-label="Number" matInput [formControl]="myControlMembro" [matAutocomplete]="auto">
              <mat-autocomplete #auto="matAutocomplete">
                <mat-option *ngFor="let option of filteredMembro | async" [value]="option.nome" 
                (onSelectionChange)="onSelectionChangedMembroNome($event,option)">
                  {{option.nome}}
                </mat-option>
              </mat-autocomplete>
            </mat-form-field>

            <mat-form-field class="example-full-width">
              <input type="text" placeholder="CPF" aria-label="Number" matInput [formControl]="myControlMembro" [matAutocomplete]="aut">
              <mat-autocomplete #aut="matAutocomplete">
                <mat-option *ngFor="let option of filteredMembro | async" [value]="option.cpf" 
                (onSelectionChange)="onSelectionChangedMembroCpf($event,option)">
                  {{option.cpf}}
                </mat-option>
              </mat-autocomplete>
            </mat-form-field>
          </div>
          <div [hidden]="titulo=='Novo'">
            <mat-form-field>
              <mat-label>Status</mat-label>
              <mat-select formControlName="status" id="status">
                <mat-option *ngFor="let item of comboStatus" [value]="item.codigo">
                  {{item.value}}
                </mat-option>
              </mat-select>
            </mat-form-field>
          </div>
          <div>
            <mat-form-field class="example-full-width">
              <input type="text" [(ngModel)]="ngPerfil"  placeholder="Perfil" aria-label="Number" matInput [formControl]="myControlMembro" [matAutocomplete]="at">
              <mat-autocomplete #at="matAutocomplete">
                <mat-option *ngFor="let option of filteredPerfil | async" [value]="option.nome" 
                (onSelectionChange)="onSelectionChangedPerfil($event,option)">
                  {{option.nome}}
                </mat-option>
              </mat-autocomplete>
            </mat-form-field>   
            <button mat-raised-button color="primary" type="button" (click)="adicionar()">
              <i class="material-icons">add</i>adicionar</button>
          </div>
        </form>
        <div class="table-responsive" *ngIf="perfis.length > 0">
          <table>
            <thead class="text-primary">
              <th>Nome</th>
              <th>Remover</th>
            </thead>
            <tbody>
              <tr *ngFor="let item of perfis">
                <td>{{ item.nome}}</td>
                <td><span style="color: #1d68a5;cursor: pointer" (click)="remover(item)"><i
                      class="material-icons">delete</i></span></td>
              </tr>
            </tbody>
          </table>
        </div>
        <br />
        <br />
        <div>
          <button mat-raised-button color="primary" type="submit" (click)="saveOrEdit()">
            <i class="material-icons">save</i>Salvar</button>
          <div fxFlex></div>
          <button mat-raised-button color="warn" type="submit" (click)="voltar()">
            <i class="material-icons">reply</i>Voltar</button>
        </div>
      </div>
    </div>
  </div>
</div>
