<div fxLayout="column" class="components-container-gt-xs" [ngClass.xs]="'components-container-xs'" fxLayoutGap="20px">
  <div fxFlex class="cdk-component-holder mat-elevation-z4">
    <mat-toolbar class="cdk-header">
      <i class="material-icons">person</i>
      <h1 class="mat-headline center-align">Usuario</h1>
    </mat-toolbar>
    <div class="cdk-container">
      <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="100px">
        <button mat-raised-button color="primary" type="submit" (click)="cadastrar()">
          <i class="material-icons">add</i>Novo</button>
      </div>
      <form form [formGroup]="form">
        <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="20px">
          <mat-form-field class="full-width-field">
            <input matInput placeholder="Nome" formControlName="nome" id="nome">
          </mat-form-field>
          <mat-form-field class="full-width-field">
            <input matInput placeholder="Login" formControlName="login" id="login">
          </mat-form-field>
        </div>
        <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="20px">
          <mat-form-field>
            <mat-label>Status</mat-label>
            <mat-select formControlName="status" id="status">
              <mat-option *ngFor="let item of comboStatus" [value]="item.codigo">
                {{item.value}}
              </mat-option>
            </mat-select>
          </mat-form-field>
        </div>
      </form>
      <br />
      <br />
      <div>
        <button mat-raised-button color="primary" type="submit" (click)="pesquisar()">
          <i class="material-icons">search</i>Buscar</button>
        <div [hidden]="!loading" align="center" style="width: 100%">
          <h4>Buscando...</h4>
          <mat-spinner [diameter]="40"></mat-spinner>
        </div>
        <div class="example-header" style="padding: 0 20px;" *ngIf="dados.data.length > 0 && !loading">
          <mat-form-field floatPlaceholder="never" style="color: black; width: 100%;">
            <input matInput (keyup)="applyFilter($event.target.value)" placeholder="Filtrar">
          </mat-form-field>
        </div>
        <div *ngIf="dados.data.length > 0 && !loading">
          <mat-table #table [dataSource]="dados" matSort style="margin-top: 20px;">
            <ng-container matColumnDef="{{ column.id }}" *ngFor="let column of columnNames">
              <mat-header-cell *matHeaderCellDef mat-sort-header> {{column.value}} </mat-header-cell>
              <mat-cell *matCellDef="let element">
                <span *ngIf="column.id!='id'">{{element[column.id]}}</span>
                <span *ngIf="column.id=='id'" style="cursor: pointer;color:#1d68a5" (click)="editar(element.id)"><i
                    class="material-icons">create</i></span>
              </mat-cell>
            </ng-container>
            <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
            <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
          </mat-table>
          <mat-paginator #paginator [length]="dados.length" [pageSize]="5" [pageSizeOptions]="[5, 10, 20]"
            [pageIndex]="pageIndex" (page)="paginatorEvent($event)" showFirstLastButtons></mat-paginator>
        </div>
      </div>
