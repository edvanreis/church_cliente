<div fxLayout="column" class="components-container-gt-xs" [ngClass.xs]="'components-container-xs'" fxLayoutGap="20px">
  <div fxFlex class="cdk-component-holder button-component-holder mat-elevation-z4">
    <mat-toolbar class="cdk-header">
      <span><i class="material-icons">calendar_today</i></span>
      <h1 class="mat-headline center-align">Agendamentos</h1>
    </mat-toolbar>
    <div class="cdk-container">
      <br />
      <div style="padding: 0 20px;">
        <mat-form-field class="full-width-field">
          <mat-label>Mês e Ano</mat-label>
          <input matInput [matDatepicker]="dp" [formControl]="date" readonly required>
          <mat-datepicker-toggle matSuffix [for]="dp"></mat-datepicker-toggle>
          <mat-datepicker #dp startView="multi-year" (yearSelected)="chosenYearHandler($event)"
            (monthSelected)="chosenMonthHandler($event, dp)" panelClass="example-month-picker">
          </mat-datepicker>
        </mat-form-field>
      </div>
      <div style="padding: 0 20px;">
        <mat-form-field class="full-width-field">
          <input type="text" placeholder="Igreja" aria-label="Number" matInput [formControl]="myControlIgreja"
            [matAutocomplete]="auto" [(ngModel)]="igrejaValue" style="width: 100%;">
          <mat-autocomplete #auto="matAutocomplete">
            <mat-option *ngFor="let option of filteredIgreja | async" [value]="option.nome"
              (onSelectionChange)="onSelectionChange($event,option)">
              {{option.nome}}
            </mat-option>
          </mat-autocomplete>
        </mat-form-field>
      </div>
      <mat-card *ngIf="agendamentos.length > 0" style="overflow: auto; height: 500px;padding: 0 20px;">
        <mat-card-header>
          <br />
          <mat-card-title style="color:#1d68a5;"><b>Agenda</b></mat-card-title>
          <mat-card-subtitle style="color:#1d68a5;"><i class="col-md material-icons ">wysiwyg</i></mat-card-subtitle>
        </mat-card-header>
        <div *ngFor="let group of agendamentos | groupBy:'dataAgendamento'" >
          <mat-expansion-panel>
            <mat-expansion-panel-header  [ngStyle]="{'background-color':naoExisteAgendamento(group)?'#d9f2d9':''}">
              <span style="font-size: 12px;"><b>{{group?.key}}</b></span>
              <span class="default-botoes" style="text-align: right; float: right;" (click)="cadastrar(group.key)">
                <i class="col-md material-icons ">add_circle</i>
              </span>
              <span class="default-botoes" style="text-align: right; float: right;" *ngIf="!naoExisteAgendamento(group)">
                <i class="col-md material-icons ">create</i>
              </span>
              <span class="default-botoes" style="text-align: right; float: right;" *ngIf="!naoExisteAgendamento(group)">
                <i class="col-md material-icons ">delete</i>
              </span>
            </mat-expansion-panel-header>
            <br />
            <div *ngFor="let item of group.value">
              <span>{{ item.horaInicio }}</span><span>{{ item.horaFim }}</span>
            </div>
          </mat-expansion-panel>
        </div>
    </mat-card>
    </div>
  </div>
</div>
