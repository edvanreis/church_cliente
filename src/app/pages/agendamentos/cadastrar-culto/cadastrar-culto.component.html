<div fxLayout="column" class="components-container-gt-xs" [ngClass.xs]="'components-container-xs'" fxLayoutGap="20px">
  <div fxFlex class="cdk-component-holder button-component-holder mat-elevation-z4">
    <mat-toolbar class="cdk-header">
      <span><i class="material-icons">wysiwyg</i></span>
      <h1 class="mat-headline center-align">Agendamento</h1>
    </mat-toolbar>
    <div class="cdk-container">
      <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="20px" class="default-font-color">
        <i class="material-icons">alarm_add</i>
        <h1 class="mat-subheading-2 center-align">Dados do agendamento</h1>
      </div>
      <form form [formGroup]="form">
        <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="20px">
          <mat-form-field class="full-width-field">
            <input matInput class="input-upper" placeholder="Nome" formControlName="nome" id="nome" required>
            <mat-error *ngIf="!form.controls.nome.valid">Campo Obrigatório</mat-error>
          </mat-form-field>
        </div>
          <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="20px">
            <mat-form-field class="full-width-field">
              <input matInput placeholder="Data do agendamento" formControlName="dataAgendamento"
              [textMask]="{mask: maskDate}" required>
              <mat-error *ngIf="!form.controls.dataAgendamento.valid">Campo Obrigatório</mat-error>
            </mat-form-field>
            <mat-form-field class="full-width-field">
              <input matInput  type="number"  placeholder="Quantidade Pessoas" formControlName="qtdPessoas" id="qtdPessoas" >
              <mat-error *ngIf="!form.controls.qtdPessoas.valid">Campo Obrigatório</mat-error>
            </mat-form-field>
          </div>
          <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="20px">
            <mat-form-field class="full-width-field">
              <input matInput placeholder="Horário Inicio" [textMask]="{mask: maskHorario}" formControlName="horaInicio"
                id="horarioIni" required>
              <mat-error *ngIf="!form.controls.horaInicio.valid">Campo Obrigatório</mat-error>
            </mat-form-field>
            <mat-form-field class="full-width-field">
              <input matInput placeholder="Horário Fim" [textMask]="{mask: maskHorario}" formControlName="horaFim"
                id="horarioFim" required>
              <mat-error *ngIf="!form.controls.horaFim.valid">Campo Obrigatório</mat-error>
            </mat-form-field>
          </div>
          <div>
            <mat-form-field class="full-width-field">
              <input type="text" placeholder="Igreja" aria-label="Number" matInput [formControl]="myControlIgreja"
                [matAutocomplete]="au" style="width: 100%;" [(ngModel)]="igrejaValue" >
              <mat-autocomplete #au="matAutocomplete">
                <mat-option *ngFor="let option of filteredIgreja | async" [value]="option.nome"
                  (onSelectionChange)="onSelectionIgrejaChange($event,option)">
                  {{option.nome}}
                </mat-option>
              </mat-autocomplete>
            </mat-form-field>
          </div>
          <div>
            <mat-form-field class="full-width-field">
              <textarea matInput placeholder="Descrição" formControlName="descricao"></textarea>
            </mat-form-field>
          </div>
      </form>
      <div>
      <button mat-raised-button color="primary" type="submit" (click)="adicionar()" *ngIf="!isEditar">
        <i class="material-icons">add</i>Adicionar</button>
      </div>
      <br />
      <div [hidden]="!loading" align="center" style="width: 100%">
        <h4>Buscando...</h4>
        <mat-spinner [diameter]="40"></mat-spinner>
      </div>
      <div *ngIf="agendamentos.length > 0 && !loading">
        <mat-form-field floatPlaceholder="never" style="color: black; width: 100%;">
          <input matInput (keyup)="applyFilter($event.target.value)" placeholder="Filtrar">
        </mat-form-field>
      </div>
      <div *ngIf="agendamentos.length > 0 && !loading">
        <mat-table #table [dataSource]="dados" matSort style="margin-top: 20px;">
          <ng-container matColumnDef="{{ column.id }}" *ngFor="let column of columnNames">
            <mat-header-cell *matHeaderCellDef mat-sort-header> {{column.value}} </mat-header-cell>
            <mat-cell *matCellDef="let element ;let i= index">
              <span
                *ngIf="column.id!='id'
                 && column.id!='horaInicio'
                 && column.id!='horaFim'
                 && column.id!='qtdPessoas'">{{element[column.id]}}</span>
              <span *ngIf="column.id=='horaInicio'">
                <input [(ngModel)]="element.horaInicio" size="10" style="text-align: center;" id="entrada"
                  [textMask]="{mask: maskHorario}" />
              </span>
              <span *ngIf="column.id=='horaFim'">
                <input [(ngModel)]="element.horaFim" size="10" style="text-align: center;" id="saida"
                  [textMask]="{mask: maskHorario}" />
              </span>
              <span *ngIf="column.id=='qtdPessoas'">
                <input [(ngModel)]="element.qtdPessoas" size="10" style="text-align: center;" id="qtdPessoas"/>
              </span>
              <span title="Excluir" *ngIf="column.id=='id'" class="default-botoes" (click)="dialogRemover(i,element)"><i
                  class="material-icons">delete</i></span>
            </mat-cell>
          </ng-container>
          <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
          <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
        </mat-table>
        <mat-paginator #paginator [length]="dados.length" [pageSize]="5" [pageSizeOptions]="[5, 10, 20]"
          showFirstLastButtons></mat-paginator>
      </div>
      <div>
        <button mat-raised-button color="primary" type="submit" (click)="salvar()" *ngIf="!isEditar">
          <i class="material-icons">save</i>Salvar</button>
        <button mat-raised-button color="primary" type="submit" (click)="update()" *ngIf="isEditar">
          <i class="material-icons">save</i>Salvar</button>
        <div fxFlex></div>
        <button mat-raised-button color="warn" type="submit" (click)="voltar()">
          <i class="material-icons">reply</i>Voltar</button>
      </div>
    </div>
  </div>
</div>
