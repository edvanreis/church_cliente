<div fxLayout="column" class="components-container-gt-xs" [ngClass.xs]="'components-container-xs'" fxLayoutGap="20px">
  <div fxFlex class="cdk-component-holder button-component-holder mat-elevation-z4">
    <mat-toolbar class="cdk-header">
      <span><i class="material-icons">wysiwyg</i></span>
      <h1 class="mat-headline center-align">Agendamento - {{data}}</h1>
    </mat-toolbar>
    <div class="cdk-container">
      <form form [formGroup]="form">
        <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="20px">
          <mat-form-field class="full-width-field">
            <input matInput class="input-upper" placeholder="Nome" formControlName="nome" id="nome" required>
            <mat-error *ngIf="!form.controls.nome.valid">Campo Obrigatório</mat-error>
          </mat-form-field>
        </div>
        <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="20px">
          <mat-form-field class="example-full-width">
            <input matInput placeholder="Horário Inicio" [textMask]="{mask: maskHorario}" formControlName="horaInicio"
              id="horarioIni" required>
              <mat-error *ngIf="!form.controls.horaInicio.valid">Campo Obrigatório</mat-error>
          </mat-form-field>
          <mat-form-field class="example-full-width">
            <input matInput placeholder="Horário Fim" [textMask]="{mask: maskHorario}" formControlName="horaFim"
              id="horarioFim" required>
              <mat-error *ngIf="!form.controls.horaFim.valid">Campo Obrigatório</mat-error>
          </mat-form-field>
        </div>
        <div>
          <mat-form-field class="full-width-field">
            <textarea matInput placeholder="Descrição"  formControlName="descricao" required></textarea>
            <mat-error *ngIf="!form.controls.descricao.valid">Campo Obrigatório</mat-error>
          </mat-form-field>
        </div>
       </form>
       <div>
        <button mat-raised-button color="primary" type="submit" (click)="salvar()">
          <i class="material-icons">save</i>Salvar</button>
        <div fxFlex></div>
        <button mat-raised-button color="warn" type="submit" (click)="voltar()">
          <i class="material-icons">reply</i>Voltar</button>
      </div>
    </div>
  </div>
</div>
