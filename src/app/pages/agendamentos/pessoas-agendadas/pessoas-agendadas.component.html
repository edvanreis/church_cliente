<div fxLayout="column" class="components-container-gt-xs" [ngClass.xs]="'components-container-xs'" fxLayoutGap="20px">
  <div fxFlex class="cdk-component-holder button-component-holder mat-elevation-z4">
    <mat-toolbar class="cdk-header">
      <span><i class="material-icons">group</i></span>
      <h1 class="mat-headline center-align">Pessoas Agendadas</h1>
    </mat-toolbar>
    <div class="cdk-container">
      <br />
      <div>
        <br />
        <br />
      </div>
      <app-igrejas></app-igrejas>
      <div>
        <mat-form-field class="full-width-field">
          <input type="text" placeholder="Agendamentos" aria-label="Number" matInput [formControl]="myControlAgendamento"
            [matAutocomplete]="auto"  style="width: 100%;" [(ngModel)]="agendamentoValue">
          <mat-autocomplete #auto="matAutocomplete">
            <mat-option *ngFor="let option of filteredAgendamento | async" [value]="option.dataTipoDeCulto"
              (onSelectionChange)="onSelectionChange($event,option)">
              {{option.dataTipoDeCulto}}
            </mat-option>
          </mat-autocomplete>
        </mat-form-field>
      </div>
      <br />
      <br />
      <div fxLayout="row" fxLayout="row wrap">
        <div *ngFor="let dash of dashCard" fxFlex.lt-sm="100" fxFlex.sm="50" fxFlex.md="25">
          <cdk-dashcard [dashData]="dash"></cdk-dashcard>
        </div>
      </div>
      <br />
      <br />
      <div>
        <mat-form-field floatPlaceholder="never" style="color: black; width: 100%;">
          <input matInput (keyup)="applyFilter($event.target.value)" placeholder="Filtrar">
        </mat-form-field>
      </div>
      <mat-table #table [dataSource]="dados" matSort style="margin-top: 20px;" >
        <ng-container matColumnDef="{{ column.id }}" *ngFor="let column of columnNames">
          <mat-header-cell *matHeaderCellDef mat-sort-header> {{column.value}} </mat-header-cell>
          <mat-cell *matCellDef="let element">
            <span *ngIf="column.id!='id' && column.id!='justificar'" matTooltip="{{element[column.id]}}">
              {{(element[column.id]?.length > 50) ? ((element[column.id])?.slice(0, 50) + '...') : element[column.id]}}
            </span>
            <span matTooltip="Confirmar" *ngIf="column.id=='id' && column.id!='justificar'">
              <mat-slide-toggle [(ngModel)]="element.presente" id="presente" (change)="confirmar(element.id,presente.checked)" #presente>
                {{presente.checked | boolean : ['Sim', 'Não']}}
              </mat-slide-toggle>
            </span>
            <span class="default-botoes" (click)="dialogJustificar(element.id)"  *ngIf="column.id!='id' && column.id=='justificar'" matTooltip="Justificar">
              <i class="material-icons">record_voice_over</i>
            </span>
          </mat-cell>
        </ng-container>
        <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
        <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
      </mat-table>
      <mat-paginator #paginator [length]="dados.length" [pageSize]="5" [pageSizeOptions]="[5, 10, 20]"
        showFirstLastButtons></mat-paginator>
      <div>
        <button mat-raised-button color="success" (click)="exportAsXLSX()"><i
            class="material-icons">vertical_align_bottom</i>Exportar XLSX</button>
      </div>
    </div>
  </div>
</div>
