<div fxLayout="column" class="components-container-gt-xs" [ngClass.xs]="'components-container-xs'" fxLayoutGap="20px">
  <div fxFlex class="cdk-component-holder button-component-holder mat-elevation-z4">
    <mat-toolbar class="cdk-header">
      <span><i class="material-icons">group_add</i></span>
      <h1 class="mat-headline center-align">Nova Célula</h1>
    </mat-toolbar>
    <div class="cdk-container">
      <form form [formGroup]="form">
        <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="20px">
          <mat-form-field class="example-full-width">
            <input matInput class="input-upper" placeholder="Nome" formControlName="nome" id="nome" required>
            <mat-error *ngIf="!form.controls.nome.valid">Campo Obrigatório</mat-error>
          </mat-form-field>
          <mat-form-field>
            <input matInput [matDatepicker]="picker" placeholder="Data de abertura" formControlName="dataAbertura"
              readonly>
            <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
            <mat-datepicker #picker></mat-datepicker>
            <mat-error *ngIf="!form.controls.dataAbertura.valid">Campo Obrigatório</mat-error>
          </mat-form-field>
        </div>
        <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="20px">
          <mat-form-field class="example-full-width">
            <input matInput placeholder="Horário" [textMask]="{mask: maskHorario}" formControlName="horario"
              id="horario" required>
          </mat-form-field>
          <mat-form-field>
            <mat-label>Turno</mat-label>
            <mat-select formControlName="turno" id="turno" required>
              <mat-option *ngFor="let item of comboTurno | keyValue" [value]="item.key">
                {{item.value}}
              </mat-option>
            </mat-select>
          </mat-form-field>
        </div>
        <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="20px">
          <mat-form-field>
            <mat-label>Dia da semana</mat-label>
            <mat-select formControlName="diaSemana" id="diaSemana" required>
              <mat-option *ngFor="let item of comboSemana | keyValue" [value]="item.key">
                {{item.value}}
              </mat-option>
            </mat-select>
          </mat-form-field>
          <mat-form-field>
            <mat-label>Tipo de Célula</mat-label>
            <mat-select formControlName="tipo" id="tipo" required>
              <mat-option *ngFor="let item of comboTipoCelula | keyValue" [value]="item.key">
                {{item.value}}
              </mat-option>
            </mat-select>
          </mat-form-field>
        </div>
      </form>
      <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="20px">
        <app-membro [label]="lider"></app-membro>
        <app-membro [label]="coLider"></app-membro>
        
      </div>
      <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="20px">
        <app-igrejas></app-igrejas>
        <mat-form-field class="example-full-width">
          <input matInput placeholder="Pastor" [(ngModel)]="pastor" disabled="disabled">
        </mat-form-field>
      </div>
      <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="20px">
        <app-membro [label]="anfitriao"></app-membro>
        <app-redes></app-redes>
      </div>
      <app-endereco></app-endereco>
      <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="20px">
        <mat-form-field class="example-full-width">
          <textarea matInput placeholder="Nota/Observação" [(ngModel)]="observacao"></textarea>
        </mat-form-field>
      </div>
      <div>
        <app-membro [label]="supervisor"></app-membro>
          <button mat-raised-button color="primary" type="submit" (click)="adicionar()">
          <i class="material-icons">add</i>adicionar</button>
      </div>
      <br />
      <br />
      <div class="table-responsive" *ngIf="supervisores.length > 0">
        <table>
          <thead class="text-primary">
            <th>Nome</th>    
            <th>Remover</th>
          </thead>
          <tbody>
            <tr *ngFor="let m of supervisores">
              <td>{{ m.nomeCompleto}}</td>
              <td><span style="color: #1d68a5;cursor: pointer" (click)="remover(i)"><i
                    class="material-icons">delete</i></span></td>
            </tr>
          </tbody>
        </table>
      </div>
      <br />
      <br />
      <div>
        <button mat-raised-button color="primary" type="submit" (click)="salvar()">
          <i class="material-icons">save</i>Salvar</button>
        <div fxFlex></div>
        <button mat-raised-button color="warn" type="submit" (click)="voltar()">
          <i class="material-icons">reply</i>Voltar</button>
      </div>
    </div>
  </div>
</div>
