<div fxLayout="column" class="components-container-gt-xs" [ngClass.xs]="'components-container-xs'" fxLayoutGap="20px">
  <div fxFlex class="cdk-component-holder button-component-holder mat-elevation-z4">
    <mat-toolbar class="cdk-header">
      <i class="material-icons">search</i>
      <h1 class="mat-headline center-align">Pesquisar</h1>
    </mat-toolbar>
    <div class="cdk-container">
      <div fxFlex.xs="100" fxFlex.lg="100" fxFlex.md="100" fxFlex.sm="100">
        <form>
          <mat-expansion-panel>
            <mat-expansion-panel-header>
              <span class="default-font-color"><i class="material-icons">face</i>
                Dados pessoais
              </span>
            </mat-expansion-panel-header>
            <form form [formGroup]="form">
            <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="20px">
              <mat-form-field class="example-full-width">
                <input matInput placeholder="Nome" formControlName="nome" id="nome" >
              </mat-form-field>
              <mat-form-field class="example-full-width">
                <input matInput placeholder="Sobre Nome" formControlName="sobrenome" id="sobrenome" >
              </mat-form-field>
            </div>
            <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="20px">
              <mat-form-field class="example-full-width">
                <input matInput placeholder="RG" [textMask]="{mask: maskRG}" formControlName="rg" id="rg" >
              </mat-form-field>
              <mat-form-field class="example-full-width">
                <input matInput placeholder="CPF" [textMask]="{mask: maskCPF}" formControlName="cpf" id="cpf" >  
              </mat-form-field>
            </div>
            <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="20px">
              <mat-form-field>
                <mat-label>Sexo</mat-label>
                <mat-select formControlName="sexo" id="sexo" > 
                  <mat-option *ngFor="let item of comboSexo | keyValue" [value]="item.key">
                    {{item.value}}
                  </mat-option>
                </mat-select>
              </mat-form-field>
              <mat-form-field>
                <mat-label>Estado Civil</mat-label>
                <mat-select formControlName="estadoCivil" id="estadoCivil" >
                  <mat-option *ngFor="let item of comboEstadoCivil | keyValue" [value]="item.key">
                    {{item.value}}
                  </mat-option>
                </mat-select>
              </mat-form-field>
            </div>
            <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="20px">
              <mat-form-field>
                <input matInput [matDatepicker]="picker" placeholder="Data nascimento" formControlName="dataNascimento" >
                <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
                <mat-datepicker #picker></mat-datepicker>
              </mat-form-field> 
            </div>
            <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="20px">
              <mat-form-field class="example-full-width">
                <input matInput placeholder="Nacionalidade" formControlName="nacionalidade" id="nacionalidade" >
              </mat-form-field>
              <mat-form-field class="example-full-width">
                <input matInput placeholder="Profissão" formControlName="profissao" id="profissao">
              </mat-form-field>
            </div>
            <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="20px" required>
              <mat-checkbox formControlName="batizado" >Batizado</mat-checkbox>
              <mat-checkbox formControlName="dizimista" >Dizimista</mat-checkbox>
            </div>
          </form>
          </mat-expansion-panel>
          <mat-expansion-panel>
            <mat-expansion-panel-header>
              <span style="color:#1d68a5"><i class="material-icons">store_mall_directory</i>
                Endereço
              </span>
            </mat-expansion-panel-header>
            <app-endereco></app-endereco>
          </mat-expansion-panel>
          <mat-expansion-panel>
              <mat-expansion-panel-header>
              <span class="default-font-color"><i class="material-icons">calendar_today</i>
                Períodos
              </span>
              </mat-expansion-panel-header>
              <form formDate [formGroup]="formDate"> 
              <div class="default-font-color"><h3>Data de criação</h3></div> 
              <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="20px">
                  <mat-form-field>
                    <input matInput [matDatepicker]="picker1" placeholder="Data inicio" formControlName="dataInicioAt">
                    <mat-datepicker-toggle matSuffix [for]="picker1"></mat-datepicker-toggle>
                    <mat-datepicker #picker1></mat-datepicker>
                  </mat-form-field>
                  <mat-form-field>
                    <input matInput [matDatepicker]="picker2" placeholder="Data fim" formControlName="dataFimAt">
                    <mat-datepicker-toggle matSuffix [for]="picker2"></mat-datepicker-toggle>
                    <mat-datepicker #picker2></mat-datepicker>
                  </mat-form-field>
                </div>
                <div class="default-font-color"><h3>Data de iniativação</h3></div> 
                <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="20px">
                    <mat-form-field>
                      <input matInput [matDatepicker]="picker3" placeholder="Data inicio" formControlName="dataInicioIn">
                      <mat-datepicker-toggle matSuffix [for]="picker3"></mat-datepicker-toggle>
                      <mat-datepicker #picker3></mat-datepicker>
                    </mat-form-field>
                    <mat-form-field>
                      <input matInput [matDatepicker]="picker4" placeholder="Data fim" formControlName="dataFimIn">
                      <mat-datepicker-toggle matSuffix [for]="picker4"></mat-datepicker-toggle>
                      <mat-datepicker #picker4></mat-datepicker>
                    </mat-form-field>
                  </div>
              </form>
            </mat-expansion-panel>
          <br />
          <br />
          <button mat-raised-button color="primary" type="submit" (click)="pesquisar()">
            <i class="material-icons">search</i>Buscar</button>
        </form>
        <div [hidden]="!loading" align="center" style="width: 100%">
          <h4>Buscando...</h4>
          <mat-spinner [diameter]="40"></mat-spinner>
        </div>
        <br />
        <br />
        <div *ngIf="lista.length > 0 && !loading">
          <mat-form-field>
            <input matInput (keyup)="applyFilter($event.target.value)" placeholder="Filtrar">
          </mat-form-field>
          <mat-table #table [dataSource]="dados" matSort>
            <ng-container matColumnDef="{{ column.id }}" *ngFor="let column of columnNames">
              <mat-header-cell *matHeaderCellDef mat-sort-header> {{column.value}} </mat-header-cell>
              <mat-cell *matCellDef="let element"> {{element[column.id]}} </mat-cell>
            </ng-container>
            <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
            <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>

          </mat-table>
          <mat-paginator #paginator [length]="dados.length" [pageSize]="5" [pageSizeOptions]="[5, 10, 20]"
            showFirstLastButtons></mat-paginator>
        </div>
        <button mat-raised-button color="success" (click)="exportAsXLSX()"
            *ngIf="lista.length > 0  && !loading"><i class="material-icons">vertical_align_bottom</i>Exportar XLSX</button>
      </div>
    </div>
  </div>
</div>
