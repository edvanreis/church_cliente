<div>
  <mat-form-field class="full-width-field">
    <input type="text" placeholder="Celula" aria-label="Number" matInput [formControl]="myControl"
      [matAutocomplete]="auto" [(ngModel)]="nomeValue">
    <mat-autocomplete #auto="matAutocomplete">
      <mat-option *ngFor="let option of filteredF | async" [value]="option.nome"
        (onSelectionChange)="onSelectionChange($event,option)">
        {{option.tema}}
      </mat-option>
    </mat-autocomplete>
  </mat-form-field>
</div>
