<form form [formGroup]="form">
  <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="20px">
    <mat-form-field class="full-width-field">
      <mat-label>Selecione...</mat-label>
      <mat-select formControlName="contatos" id="contatos" (selectionChange)="tipo($event)">
        <mat-option *ngFor="let item of comboTipoContatos" [value]="item.tipo">
          {{item.descTipoContato}}
        </mat-option>
      </mat-select>
    </mat-form-field>
    <mat-form-field class="full-width-field">
      <input matInput placeholder="Contato" formControlName="contato" id="contato" *ngIf="isContato">
      <input matInput placeholder="Contato" formControlName="contatoTelefone" [textMask]="{mask: maskTelefone}"
        id="contatoTelefone" *ngIf="isTelefone">
      <input matInput placeholder="Contato" formControlName="contatoCelular" [textMask]="{mask: maskCelular}"
        id="contatoCelular" *ngIf="isCelular">
      <input type="email" matInput placeholder="Contato" formControlName="email" id="email" *ngIf="isEmail">
    </mat-form-field>
    <mat-checkbox formControlName="whatsapp" *ngIf="isCelular && !isContato">Whatsapp</mat-checkbox>
    <mat-checkbox formControlName="emailPrincipal" *ngIf="isEmail">Email principal</mat-checkbox>
  </div>
  <button mat-raised-button color="primary" type="submit" (click)="adicionar()">
    <i class="material-icons">add</i>adicionar</button>
  <br /><br />
  <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="20px" *ngIf="contatos.length > 0">
      <div class="table-responsive">
        <table>
          <thead class="text-primary">
            <th>Tipo</th>
            <th>Descrição</th>
            <th></th>
            <th>Email principal</th>                     
            <th>Remover</th>
          </thead>
          <tbody>
            <tr *ngFor="let c of contatosGrid">
              <td>{{ c.tipo}}</td>
              <td>{{ c.contato }}</td>      
              <td><img src="./assets/whatsapp.png" width="20px" *ngIf="c.whatsapp">
                <img src="./assets/images/facebook_circle.png" width="20px" *ngIf="c.facebook">
                <span style="color: #1d68a5" *ngIf="c.email"><i class="material-icons">mail</i></span>
                <span style="color: #1d68a5" *ngIf="c.telefone"><i class="material-icons">call</i></span></td>
                <td><span  style="color:green" *ngIf="c.emailPrincipal" ><i class="material-icons">checked</i></span></td>
              <td><span style="color: #1d68a5;cursor: pointer" (click)="remover(c)"><i
                    class="material-icons">delete</i></span></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
</form>
