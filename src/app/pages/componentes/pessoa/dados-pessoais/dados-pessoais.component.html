<form form [formGroup]="form">
  <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="20px">
    <mat-form-field class="full-width-field">
      <input matInput class="input-upper" placeholder="Nome" formControlName="nome" id="nome" (change)="change()" required>
      <mat-error *ngIf="!form.controls.nome.valid">Campo Obrigatório</mat-error>
    </mat-form-field>
  </div>
  <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="20px"> 
    <mat-form-field class="full-width-field">
      <input matInput  class="input-upper" placeholder="Sobre Nome" formControlName="sobrenome" id="sobrenome" (change)="change()" required>
      <mat-error *ngIf="!form.controls.sobrenome.valid">Campo Obrigatório</mat-error>
    </mat-form-field>
  </div>
  <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="20px">
    <mat-form-field class="full-width-field">
      <input matInput placeholder="RG" [textMask]="{mask: maskRG}" formControlName="rg" id="rg" (change)="change()" required>
      <mat-error *ngIf="!form.controls.rg.valid">Campo Obrigatório</mat-error>
    </mat-form-field>
    <mat-form-field class="full-width-field">
      <input matInput placeholder="CPF" [textMask]="{mask: maskCPF}" formControlName="cpf" id="cpf" (change)="change()" required>  
      <mat-error *ngIf="!form.controls.cpf.valid">Campo Obrigatório</mat-error>
    </mat-form-field>
  </div>
  <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="20px">
    <mat-form-field class="full-width-field">
      <input matInput [textMask]="{mask: maskDate}" placeholder="Data nascimento" formControlName="dataNascimento"  (change)="change()">
      <mat-error *ngIf="!form.controls.dataNascimento.valid">Campo Obrigatório</mat-error>
    </mat-form-field> 
    <mat-form-field class="full-width-field">
      <mat-label>Sexo</mat-label>
      <mat-select formControlName="sexo" id="sexo" (selectionChange)="change()" required> 
        <mat-option *ngFor="let item of comboSexo | keyValue" [value]="item.key">
          {{item.value}}
        </mat-option>
      </mat-select>
      <mat-error *ngIf="!form.controls.sexo.valid">Campo Obrigatório</mat-error>
    </mat-form-field>
  </div>
  <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="20px">
    <mat-form-field class="full-width-field">
      <mat-label>Estado Civil</mat-label>
      <mat-select formControlName="estadoCivil" id="estadoCivil" (selectionChange)="change()" required>
        <mat-option *ngFor="let item of comboEstadoCivil | keyValue" [value]="item.key">
          {{item.value}}
        </mat-option>
      </mat-select>
    </mat-form-field>
    <mat-form-field class="full-width-field">
      <input matInput class="input-upper" placeholder="Nacionalidade" formControlName="nacionalidade" id="nacionalidade" (change)="change()" required>
    </mat-form-field>
  </div>
  <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="20px" required>
    <mat-form-field class="full-width-field">
      <input matInput class="input-upper" placeholder="Profissão" formControlName="profissao" id="profissao" (change)="change()">
    </mat-form-field>
  </div>
</form>
