
<div>
  <label class="default-font-color" for="filter">Etapas:</label>
  <br/>
  <mat-form-field class="full-width-field">
    <input type="text" placeholder="Buscar" aria-label="Number" matInput [formControl]="myControl">
  </mat-form-field>
 <br />
  <input type="checkbox" value="0" name="tudo" (change)="marcarDesmarcar()" [checked]=checked />
  <span class="default-font-color"><b>Todas</b></span>
  <div class="flex layout-padding" style="overflow-y: scroll; max-height:200px; padding-left: 25px">
    <mat-option *ngFor="let item of filtered | async" [value]="item.nome">
      <input type="checkbox" value="{{item.id}}" name="tudo" (change)="onCheckboxChange(item,$event)"
      [checked]="item.checked"  /> {{item.nome}}
    </mat-option>
  </div>
</div>
