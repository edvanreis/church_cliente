<div>
  <mat-form-field class="example-full-width">
    <input type="text" placeholder="{{label}}" aria-label="Number" matInput [formControl]="myControlMembro"
      [matAutocomplete]="auto" [(ngModel)]="nomeValue" required>
    <mat-autocomplete #auto="matAutocomplete">
      <mat-optgroup *ngFor="let group of filteredMembro | async" [label]="group.nomeCompleto">
        <mat-option *ngFor="let option of group.options" [value]="option"
          (onSelectionChange)="onSelectionChangedMembro($event,option)">
          {{option.nomeCompleto}}
        </mat-option>
      </mat-optgroup>
    </mat-autocomplete>
  </mat-form-field>
</div>
