<div>
  <mat-form-field>
    <mat-label>Selecione...</mat-label>
    <mat-select [(ngModel)]="etapa" id="etapa">
      <mat-option *ngFor="let item of etapa$ | async" [value]="item">
        {{item.nome}}
      </mat-option>
    </mat-select>
  </mat-form-field>
</div>
<button mat-raised-button color="primary" type="submit" (click)="adicionar()">
  <i class="material-icons">add</i>adicionar</button>
<br /><br />
<div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="20px" *ngIf="etapas.length > 0">
  <div class="table-responsive">
    <table>
      <thead class="text-primary">
        <th>Etapa</th>
        <th>REMOVER</th>
      </thead>
      <tbody>
        <tr *ngFor="let item of etapas">
          <td>{{ item.nome}}</td>
          <td><span style="color: #1d68a5;cursor: pointer" (click)="remover(item)"><i
                class="material-icons">delete</i></span></td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
