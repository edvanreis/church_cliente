<form [formGroup]="form">
  <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="20px">
    <mat-form-field class="full-width-field" >
      <mat-label>Selecione...</mat-label>
      <mat-select formControlName="escolaridade" id="escolaridade">
        <mat-option *ngFor="let item of comboEscolaridade" [value]="item">
          {{item.descricao}}
        </mat-option>
      </mat-select>
    </mat-form-field>
    <mat-form-field class="full-width-field">
      <input class="input-upper" matInput placeholder="Curso" formControlName="curso" id="curso">
    </mat-form-field>
  </div>
  <button mat-raised-button color="primary" type="submit" (click)="adicionar()">
    <i class="material-icons">add</i>adicionar</button>
</form>
<br />
<br />
<div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="20px" *ngIf="escolaridades.length > 0">
  <div class="table-responsive">
    <table>
      <thead class="text-primary">
        <th></th>
        <th>Escolaridades</th>
        <th>Curso</th>
        <th>Remover</th>
      </thead>
      <tbody>
        <tr *ngFor="let e of escolaridades">
          <td>{{ e.codigo}}</td>
          <td>{{ e.descricao}}</td>
          <td>{{ e.curso }}</td>
          <td><span style="color: #1d68a5;cursor: pointer" (click)="dialogRemover(e)"><i
                class="material-icons">delete</i></span></td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
