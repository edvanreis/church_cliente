<div fxLayout="column" fxFlexFill fxLayoutAlign="center center" style="background-image:url('../../../assets/login11.jpg');
height: 100%;
background-repeat: no-repeat;
background-position: center;
background-size: cover; ">
    <div fxLayout="column" >
   
        <div class=" mat-elevation-z4">
            <mat-card>
                <!-- <mat-card-title>User login
                    <a class="redirect" [routerLink]="['/sigup']">Register an account</a>
                </mat-card-title> -->
                <mat-card-content>
                    <form fxLayout="column" fxLayoutAlign="start stretch" [formGroup]="formlogin">
                        <mat-form-field class="full-width">
                          <input type="login" id="login" class="input" placeholder="Usuário"
                                 formControlName="login" required matInput>
                        </mat-form-field>
                        <mat-error *ngIf="!formlogin.controls.login.valid">Campo Obrigatório</mat-error>
                        <mat-form-field class="full-width">
                            <input type="password" id="password" class="input" placeholder="Senha"
                            formControlName="password" required matInput>
                        </mat-form-field>
                        <mat-error *ngIf="!formlogin.controls.password.valid">Campo Obrigatório</mat-error>
                        <!-- <button mat-raised-button color="primary" type="submit" [disabled]="!userForm.valid" (click)="login()">log in</button> -->
                        <button mat-raised-button color="primary" type="submit" (click)="login()"><i class="material-icons">person</i>Login</button>
                        <br />
                        <div class="senha">
                            <span  (click)="alterarSenha()" style="color:#1d68a5"><b>Alterar senha</b></span>
                        </div>
                        <div class="senha">
                            <span  (click)="esqueceuSenha()" style="color:#1d68a5"><b>Esqueceu senha?</b></span>
                        </div>
                    </form>
                </mat-card-content>  
            </mat-card>
        </div>
    </div>
</div>
