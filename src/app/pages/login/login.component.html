<div fxLayout="column" fxFlexFill fxLayoutAlign="center center" [ngStyle]="{
                                                                            'height': '100%',
                                                                            'background-repeat': 'no-repeat',
                                                                            'background-position': 'center',
                                                                            'background-size': 'cover',
                                                                            'background-color':'#5c6bc0'
                                                                            }">
  <div fxLayout="column">

    <div class=" mat-elevation-z4">
      <mat-card>


        <mat-card-title align="center">
          <!-- <a class="redirect" [routerLink]="['/sigup']">Register an account</a> -->
          <img src="./assets/images/login_sistema.png" width="200px">
          <br />
          <span style="font-size: 12px;color:#5c6bc0;"><b>Sistema de Gerenciamento de Igrejas</b></span>
        </mat-card-title>
        <mat-card-content>
          <span style="font-size: 15px;color:#5c6bc0;"><b>Login:</b></span>
          <br />
          <br />
          <form fxLayout="column" fxLayoutAlign="start stretch" [formGroup]="formlogin">
            <mat-form-field class="full-width">
              <input type="login" id="login" class="input" placeholder="Usuário" formControlName="login" required
                matInput>
            </mat-form-field>
            <mat-error *ngIf="!formlogin.controls.login.valid">Campo Obrigatório</mat-error>
            <mat-form-field class="full-width">
              <input type="password" id="password" class="input" placeholder="Senha" formControlName="password" required
                matInput>
            </mat-form-field>
            <mat-error *ngIf="!formlogin.controls.password.valid">Campo Obrigatório</mat-error>
            <!-- <button mat-raised-button color="primary" type="submit" [disabled]="!userForm.valid" (click)="login()">log in</button> -->
            <br />
            <button mat-raised-button color="primary" type="submit" (click)="login()"><i
                class="material-icons">person</i>Enviar</button>
            <br />
            <div class="senha">
              <span (click)="alterarSenha()" style="color:#1d68a5"><b>Alterar senha</b></span>
            </div>
            <div class="senha">
              <span (click)="marcarAgendamento()" style="color:#1d68a5"><b>Marcar Agendamento</b></span>
            </div>
            <div class="senha">
              <span (click)="desmarcarAgendamento()" style="color:#1d68a5"><b>Desmarcar Agendamento</b></span>
            </div>
            <!-- <div class="senha">
              <span (click)="esqueceuSenha()" style="color:#1d68a5"><b>Esqueceu senha?</b></span>
            </div> -->
          </form>
        </mat-card-content>
      </mat-card>
    </div>
  </div>
</div>
