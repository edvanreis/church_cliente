<div fxLayout="column" class="components-container-gt-xs" [ngClass.xs]="'components-container-xs'" fxLayoutGap="20px">
  <div fxFlex class="cdk-component-holder button-component-holder mat-elevation-z4">
    <mat-toolbar class="cdk-header">
      <span *ngIf="titulo=='Editar'"><i class="material-icons">create</i></span>
      <span *ngIf="titulo=='Novo'"><i class="material-icons">add</i></span>
      <h1 class="mat-headline center-align">{{ titulo }} Pefil</h1>
    </mat-toolbar>
    <div class="cdk-container">
      <div fxFlex.xs="100" fxFlex.lg="100" fxFlex.md="100" fxFlex.sm="100">
        <form form [formGroup]="form">
          <div>
            <mat-form-field class="full-width-field">
              <input matInput placeholder="Nome" formControlName="nome" id="nome">
              <mat-error *ngIf="!form.controls.nome.valid">Campo Obrigatório</mat-error>
            </mat-form-field>
          </div>
          <div>
            <mat-form-field class="full-width-field">
              <textarea matInput placeholder="Descrição" formControlName="descricao"></textarea>
              <mat-error *ngIf="!form.controls.descricao.valid">Campo Obrigatório</mat-error>
            </mat-form-field>
          </div>
        </form>
        <!-- <div >
          <mat-form-field class="full-width-field">
              <mat-label>Permissões</mat-label>
            <input type="text" matInput formControlName="permissao" [matAutocomplete]="auto" >
          </mat-form-field>
          <mat-autocomplete #auto="matAutocomplete" >
            <mat-option (onSelectionChange)="onSelectionChanged($event,option)" *ngFor="let option of comboPermissao" [value]="option.nome" >{{option.nome}}</mat-option>
          </mat-autocomplete>
        </div> -->
        <div>
          <mat-form-field class="full-width-field">
            <input type="text" placeholder="Permissao" aria-label="Number" matInput [formControl]="myControl"
              [matAutocomplete]="auto" [(ngModel)]="nomeValue">
            <mat-autocomplete #auto="matAutocomplete">
              <mat-option *ngFor="let option of filtered | async" [value]="option.nome"
                (onSelectionChange)="onSelectionChanged($event,option)">
                {{option.nome}}
              </mat-option>
            </mat-autocomplete>
          </mat-form-field>
        </div>
        <div>
          <button mat-raised-button color="primary" type="button" (click)="adicionar()">
            <i class="material-icons">add</i>adicionar</button>
        </div>
        <br />
        <div class="table-responsive" *ngIf="permissoes.length > 0">
          <table>
            <thead class="text-primary">
              <th></th>
              <th>Nome</th>
              <th>Remover</th>
            </thead>
            <tbody>
              <tr *ngFor="let item of permissoes;let i = index">
                <td>{{ i+1 }}</td>
                <td>{{ item.nome}}</td>
                <td><span style="color: #1d68a5;cursor: pointer" (click)="remover(i,item)"><i
                      class="material-icons">delete</i></span></td>
              </tr>
            </tbody>
          </table>
        </div>
        <br />
        <br />
        <div>
          <button mat-raised-button color="primary" type="submit" (click)="saveOrEdit()">
            <i class="material-icons">save</i>Salvar</button>
          <div fxFlex></div>
          <button mat-raised-button color="warn" type="submit" (click)="voltar()">
            <i class="material-icons">reply</i>Voltar</button>
        </div>
      </div>
    </div>
  </div>
</div>
