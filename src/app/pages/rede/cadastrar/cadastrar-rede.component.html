<div fxLayout="column" class="components-container-gt-xs" [ngClass.xs]="'components-container-xs'" fxLayoutGap="20px">
  <div fxFlex class="cdk-component-holder button-component-holder mat-elevation-z4">
    <mat-toolbar class="cdk-header">
      <span><i class="material-icons">add</i></span>
      <h1 class="mat-headline center-align">Rede</h1>
    </mat-toolbar>
    <div class="cdk-container">
      <form form [formGroup]="form">
        <div fxLayout="row"  fxLayoutGap="20px">
          <mat-form-field class="full-width-field">
            <input matInput class="input-upper" placeholder="Nome" formControlName="nome" id="nome" required>
            <mat-error *ngIf="!form.controls.nome.valid">Campo Obrigatório</mat-error>
          </mat-form-field>
        </div>
        <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="20px">
          <mat-form-field>
            <mat-label>Selecione...</mat-label>
            <mat-select formControlName="redes" id="comboRede" >
              <mat-option *ngFor="let item of comboRede" [value]="item.rede">
                {{item.descRede}}
              </mat-option>
            </mat-select>
          </mat-form-field>
          <mat-form-field>
            <input matInput [matDatepicker]="picker"  placeholder="Data de abertura" formControlName="dataAbertura" readonly>
            <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
            <mat-datepicker #picker></mat-datepicker>
            <mat-error *ngIf="!form.controls.dataAbertura.valid">Campo Obrigatório</mat-error>
          </mat-form-field>
        </div>
        <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="100px">
          <mat-form-field class="full-width-field">
            <textarea matInput placeholder="Descrição" formControlName="descricao"></textarea>
            <mat-error *ngIf="!form.controls.descricao.valid">Campo Obrigatório</mat-error>
          </mat-form-field>
        </div>
      </form>
      <app-igrejas></app-igrejas>
      <div>
        <mat-form-field class="full-width-field">
          <input type="text" aria-label="Number" matInput [formControl]="myControlMembro" [matAutocomplete]="auto" placeholder="Membros"
            [(ngModel)]="membroValue" required>
          <mat-autocomplete #auto="matAutocomplete">
            <mat-option *ngFor="let option of filteredMembro | async" [value]="option.nomeCompleto"
              (onSelectionChange)="onSelectionChangedMembro($event,option)">
              {{option.nomeCompleto}}
            </mat-option>
          </mat-autocomplete>
        </mat-form-field>
        <button mat-raised-button color="primary" type="submit" (click)="adicionar()">
          <i class="material-icons">add</i>adicionar</button>
      </div>
      <br/>
      <div class="table-responsive" *ngIf="membros.length > 0">
        <table>
          <thead class="text-primary">
            <th></th>
            <th>Nome</th>
            <th>Célula</th>
            <th>Igreja</th>
            <th>Remover</th>
          </thead>
          <tbody>
            <tr *ngFor="let m of membros ;let i= index">
              <td>{{ i+1}}</td>
              <td>{{ m.nomeCompleto}}</td>
              <td>{{ m.celula?.nome}}</td>
              <td>{{ m.igreja?.nome}}</td>
              <td><span style="color: #1d68a5;cursor: pointer" (click)="dialogRemover(i,m)"><i
                    class="material-icons">delete</i></span></td>
            </tr>
          </tbody>
        </table>
      </div>
      <br/>
      <br/>
      <div>
        <button mat-raised-button color="primary" type="submit" (click)="salvar()">
          <i class="material-icons">save</i>Salvar</button>
        <div fxFlex></div>
        <button mat-raised-button color="warn" type="submit" (click)="voltar()">
          <i class="material-icons">reply</i>Voltar</button>
      </div>
    </div>
  </div>
</div>
