<div fxLayout="column" class="components-container-gt-xs" [ngClass.xs]="'components-container-xs'" fxLayoutGap="20px">
  <div fxFlex class="cdk-component-holder mat-elevation-z4">
    <mat-toolbar class="cdk-header">
      <i class="material-icons">search</i>
      <h1 class="mat-headline center-align">Rede</h1>
    </mat-toolbar>
    <div class="cdk-container">
      <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="100px">
        <button mat-raised-button color="primary" type="submit" (click)="cadastrar()">
          <i class="material-icons">add</i>Novo</button>
      </div>
      <br />
      <br />
      <div>
        <mat-form-field class="full-width-field">
          <input type="text" placeholder="Igreja" aria-label="Number" matInput [formControl]="myControlIgreja"
            [matAutocomplete]="auto" [(ngModel)]="igrejaValue" style="width: 100%;" (blur)="onBlurIgreja($event)">
          <mat-autocomplete #auto="matAutocomplete">
            <mat-option *ngFor="let option of filteredIgreja | async" [value]="option.nome"
              (click)="onSelectionIgrejaClick(option)">
              {{option.nome}}
            </mat-option>
          </mat-autocomplete>
        </mat-form-field>
        </div >
      <div>
        <mat-form-field class="full-width-field">
          <mat-label>Status</mat-label>
          <mat-select  [(ngModel)]="statusSelecionado" id="status">
            <mat-option *ngFor="let item of comboStatus" [value]="item.codigo"
             (click)="onSelection()">
              {{item.value}}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </div>
      <br />
      <br />
      <div [hidden]="redes.length == 0 ">
        <mat-form-field floatPlaceholder="never" style="color: black; width: 100%;">
          <input matInput (keyup)="applyFilter($event.target.value)" placeholder="Filtrar">
        </mat-form-field>
      </div>
      <mat-table #table [dataSource]="dados" matSort style="margin-top: 20px;" [hidden]="redes.length == 0">
        <ng-container matColumnDef="{{ column.id }}" *ngFor="let column of columnNames">
          <mat-header-cell *matHeaderCellDef mat-sort-header> {{column.value}} </mat-header-cell>
          <mat-cell *matCellDef="let element">
            <span *ngIf="column.id!='id'" matTooltip="{{element[column.id]}}">
              {{(element[column.id].length > 20) ? ((element[column.id]).slice(0, 20) + '...') : element[column.id]}}
            </span>
            <span *ngIf="column.id=='id'" style="cursor: pointer;color:#1d68a5" matTooltip="Editar" (click)="editar(element.id)"><i
                class="material-icons">create</i></span>
            <span *ngIf="column.id=='id'" style="cursor: pointer;color:#1d68a5" matTooltip="Status" (click)="status(element.id)"><i
                class="material-icons">settings</i></span>
          </mat-cell>
        </ng-container>
        <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
        <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
      </mat-table>
      <mat-paginator #paginator [length]="dados.length" [pageSize]="5" [pageSizeOptions]="[5, 10, 20]"
        showFirstLastButtons></mat-paginator>
        <div *ngIf="redes.lenght > 0 ">
          <button mat-raised-button color="success" (click)="exportAsXLSX()"><i
            class="material-icons">vertical_align_bottom</i>Exportar XLSX</button>
        </div>
      </div>
  </div>
