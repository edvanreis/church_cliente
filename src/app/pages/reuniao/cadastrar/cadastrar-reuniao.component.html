<div fxLayout="column" class="components-container-gt-xs" [ngClass.xs]="'components-container-xs'" fxLayoutGap="20px">
  <div fxFlex class="cdk-component-holder button-component-holder mat-elevation-z4">
    <mat-toolbar class="cdk-header">
      <span><i class="material-icons">add</i></span>
      <h1 class="mat-headline center-align">Reunião</h1>
    </mat-toolbar>
    <div class="cdk-container">
      <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="20px" style="color:#1d68a5">
        <i class="material-icons">store</i>
        <h1 class="mat-subheading-2 center-align">Relatório da reunião semanal da célula</h1>
      </div>
      <app-celula></app-celula>
      <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="20px" style="color:#1d68a5"  *ngIf="membros.length > 0">
        <i class="material-icons">face</i>
        <h1 class="mat-subheading-2 center-align">Liderança da célula</h1>
      </div>
      <div class="table-responsive" *ngIf="membros.length > 0">
        <table>
          <thead class="text-primary">
            <th>Nome</th>
            <th></th>
          </thead>
          <tbody>
            <tr *ngFor="let m of membros">
              <td>{{ m.nomeCompleto}}</td>
              <td>{{ m.descTipoPessoa}}</td>
            </tr>
          </tbody>
        </table>
      </div>
      <br />
      <mat-divider></mat-divider>
      <br />
      <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="20px" style="color:#1d68a5">
        <i class="material-icons">class</i>
        <h1 class="mat-subheading-2 center-align">Dados da Reunião</h1>
      </div>
      <form form [formGroup]="form">
        <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="20px">
          <mat-form-field>
            <input matInput [matDatepicker]="picker" placeholder="Data da reunião"
            formControlName="dataDaReuniao"
              readonly>
            <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
            <mat-datepicker #picker></mat-datepicker>
          </mat-form-field>
          <mat-form-field>
            <mat-label>Dia da semana</mat-label>
            <mat-select formControlName="diaSemana" id="diaSemana" required>
              <mat-option *ngFor="let item of comboSemana | keyValue" [value]="item.key">
                {{item.value}}
              </mat-option>
            </mat-select>
          </mat-form-field>
        </div>
        <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="20px">
          <mat-form-field class="example-full-width">
            <input matInput placeholder="Inicio" [textMask]="{mask: maskHorario}" formControlName="horaInicio"
              id="horario" required>
          </mat-form-field>
          <mat-form-field class="example-full-width">
            <input matInput placeholder="Fim" [textMask]="{mask: maskHorario}" formControlName="horaFim"
              id="horario" required>
          </mat-form-field>
        </div>
        <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="20px">
          <mat-form-field class="full-width-field">
            <input matInput placeholder="Louvor" formControlName="louvor" id="louvor" >
          </mat-form-field>
          </div>
          <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="20px">
            <mat-form-field class="full-width-field">
              <input id="oferta" matInput  placeholder="Oferta"  formControlName="oferta" (keyup)="onInputCurrency($event)"/>
            </mat-form-field>
          </div>
          <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="20px">
            <mat-form-field class="full-width-field">
              <textarea matInput placeholder="Nota/Observação" formControlName="observacao"></textarea>
            </mat-form-field>
          </div>
      </form>
      <app-licao></app-licao>
      <app-membro [label]="'Palestrante'"></app-membro>
      <mat-divider></mat-divider>
      <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="20px" style="color:#1d68a5">
        <i class="material-icons">person</i>
        <h1 class="mat-subheading-2 center-align">Membros</h1>
      </div>
      <mat-divider></mat-divider>
      <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="20px" style="color:#1d68a5">
        <i class="material-icons">person_outline</i>
        <h1 class="mat-subheading-2 center-align">Visitantes</h1>
      </div>
    </div>
  </div>
</div>
