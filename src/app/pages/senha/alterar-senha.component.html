<div fxLayout="column" class="components-container-gt-xs" [ngClass.xs]="'components-container-xs'" fxLayoutGap="20px">
  <div fxFlex class="cdk-component-holder button-component-holder mat-elevation-z4">
    <mat-toolbar class="cdk-header">
      <span><i class="material-icons">vpn_key</i></span>
      <h1 class="mat-headline center-align">Senha</h1>
    </mat-toolbar>
    <div class="cdk-container">
      <div fxFlex.xs="100" fxFlex.lg="100" fxFlex.md="100" fxFlex.sm="100">
        <form form [formGroup]="form">
          <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="20px">
            <mat-form-field class="example-full-width">
              <input matInput placeholder="CPF" formControlName="cpf" [textMask]="{mask: maskCPF}">
              <mat-error *ngIf="!form.controls.cpf.valid">Campo Obrigatório</mat-error>
            </mat-form-field>
          </div>
          <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="20px" *ngIf="isEsqueceuSenha">
            <mat-form-field class="example-full-width">
              <input matInput placeholder="Email" formControlName="email" type="email">
              <mat-error *ngIf="!form.controls.email.valid">Campo Obrigatório</mat-error>
            </mat-form-field>
          </div>
          <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="20px"  *ngIf="!isEsqueceuSenha">
            <mat-form-field>
                <input type="password"  class="input" placeholder="Senha Atual"
                formControlName="senhaAtual" required matInput>
              <mat-error *ngIf="!form.controls.senhaAtual.valid">Campo Obrigatório</mat-error>
            </mat-form-field>
          </div>
          <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="20px" *ngIf="!isEsqueceuSenha">
            <mat-form-field><input type="password"  class="input" placeholder="Nova Senha"
              formControlName="senhaNova" required matInput>
              <mat-error *ngIf="!form.controls.senhaNova.valid">Campo Obrigatório</mat-error>
            </mat-form-field>
          </div>
          <div>
              <button mat-raised-button color="primary" type="submit" (click)="alterar()" *ngIf="!isEsqueceuSenha">
                  <i class="material-icons">save</i>Salvar</button>
            <button mat-raised-button color="primary" type="submit" (click)="enviarEmail()" *ngIf="isEsqueceuSenha" >
              <i class="material-icons">save</i>Enviar</button>
            <div fxFlex></div>
            <button mat-raised-button color="warn" type="submit" (click)="voltar()">
              <i class="material-icons">reply</i>Voltar</button>
          </div>
        </form>
      </div>
    </div>
  </div>
