<div fxLayout="row" fxLayout="row wrap">
    <div *ngFor="let dash of dashCard" fxFlex.lt-sm="100" fxFlex.sm="50" fxFlex.md="25">
        <cdk-dashcard [dashData]="dash"></cdk-dashcard>
    </div>
</div>

<mat-card class="example-card">
  <mat-card-title>Membros</mat-card-title>
  <mat-card-subtitle>Membros Pendente Aprovação</mat-card-subtitle>
  <mat-card-content>
    <mat-table #table [dataSource]="dadosMembros" matSort style="margin-top: 20px;">
      <ng-container matColumnDef="{{ column.id }}" *ngFor="let column of columnNamesMembros">
        <mat-header-cell *matHeaderCellDef mat-sort-header> {{column.value}} </mat-header-cell>
        <mat-cell *matCellDef="let element">
          <span>{{element[column.id]}}</span>
        </mat-cell>
      </ng-container>
      <mat-header-row *matHeaderRowDef="displayedMembrosColumns"></mat-header-row>
      <mat-row *matRowDef="let row; columns: displayedMembrosColumns;"></mat-row>
    </mat-table>
    <mat-paginator #paginator [length]="dadosMembros.length" [pageSize]="5" [pageSizeOptions]="[5, 10, 20]"
            showFirstLastButtons></mat-paginator>
  </mat-card-content>
</mat-card>
