<div fxLayout="column" class="components-container-gt-xs" [ngClass.xs]="'components-container-xs'" fxLayoutGap="20px">
  <div fxFlex class="input-component-holder button-component-holder mat-elevation-z4">
    <mat-toolbar class="input-header">
      <i class="material-icons">person_add</i>
      <h1 class="mat-headline center-align">Cadastro</h1>
    </mat-toolbar>
    <div class="input-container">
      <div fxFlex.xs="100" fxFlex.lg="50" fxFlex.md="50" fxFlex.sm="50">
        <form>
          <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="20px">
            <mat-form-field class="example-full-width">
              <input matInput placeholder="Nome">
            </mat-form-field>
            <mat-form-field class="example-full-width">
              <input matInput placeholder="Sobrenome">
            </mat-form-field>
          </div>
          <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="20px">
            <mat-form-field class="example-full-width">
              <input matInput placeholder="RG" [textMask]="{mask: maskRG}">
            </mat-form-field>
            <mat-form-field class="example-full-width">
              <input matInput placeholder="CPF" [textMask]="{mask: maskCPF}">
            </mat-form-field>
          </div>
          <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="20px">
            <mat-form-field class="example-full-width">
              <input matInput placeholder="Data Nascimento"  [textMask]="{mask: maskDate}" >
            </mat-form-field>     
            <mat-form-field class="example-full-width">
              <input matInput placeholder="Nacionalidade">
            </mat-form-field>      
          </div>
          <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="20px">          
            <mat-form-field>
              <mat-label>Sexo</mat-label>
              <mat-select>
                <mat-option *ngFor="let item of carregarSexo$ | async" [value]="item">
                  {{item}}
                </mat-option>
              </mat-select>
            </mat-form-field>
            <mat-form-field>
              <mat-label>Estado Civil</mat-label>
              <mat-select>
                <mat-option *ngFor="let item of carregarEstadoCivil$  | async" [value]="item">
                  {{item}}
                </mat-option>
              </mat-select>
            </mat-form-field>
          </div>
          <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="20px">
            <mat-form-field>
              <mat-label>Escolaridade</mat-label>
              <mat-select>
                <mat-option *ngFor="let item of carregarEstadoCivil$  | async" [value]="item">
                  {{item}}
                </mat-option>
              </mat-select>
            </mat-form-field>
          </div>
          <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="20px">
            <mat-checkbox>Dizimista</mat-checkbox>
          </div>
          <mat-divider></mat-divider>
          <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="20px" style="color:#1d68a5">
            <i class="material-icons">portrait</i>
            <h1 class="mat-subheading-2 center-align">Contatos</h1>
          </div>
          <button mat-raised-button color="primary" type="submit">
            <i class="material-icons">add</i>adicionar</button>
          <br /><br />
          <mat-divider></mat-divider>
          <div fxLayout="row" fxLayout.lt-sm="column" fxLayoutGap="20px" style="color:#1d68a5">
            <i class="material-icons">store_mall_directory</i>
            <h1 class="mat-subheading-2 center-align">Endereço</h1>
          </div>
          <button mat-raised-button color="primary" type="submit">
            <i class="material-icons">add</i>adicionar</button>
          <br /><br />
          <mat-divider></mat-divider>
          <button mat-raised-button color="primary" type="submit">
            <i class="material-icons">save</i>Salvar</button>
        </form>
      </div>
    </div>
  </div>
</div>
