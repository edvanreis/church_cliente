<div fxLayout="column" class="components-container-gt-xs" [ngClass.xs]="'components-container-xs'" fxLayoutGap="20px">
  <div fxFlex class="input-component-holder button-component-holder mat-elevation-z4">
    <mat-toolbar class="input-header">
      <i class="material-icons">search</i>
      <h1 class="mat-headline center-align">Pesquisar</h1>
    </mat-toolbar>
    <div class="input-container">
      <div fxFlex.xs="100" fxFlex.lg="50" fxFlex.md="50" fxFlex.sm="50">
        <form>
          <mat-expansion-panel>
            <mat-expansion-panel-header>
              <span style="color:#1d68a5"><i class="material-icons">face</i></span>
              Dados pessoais
            </mat-expansion-panel-header>
            <app-dados-pessoais></app-dados-pessoais>
          </mat-expansion-panel>
          <mat-expansion-panel>
            <mat-expansion-panel-header>
                <span style="color:#1d68a5"><i class="material-icons">store_mall_directory</i></span>
              Endereço
            </mat-expansion-panel-header>
          </mat-expansion-panel>
          <mat-expansion-panel>
            <mat-expansion-panel-header>
                <span style="color:#1d68a5"><i class="material-icons">headset_mic</i></span>
              Contatos
            </mat-expansion-panel-header>
          </mat-expansion-panel>
          <mat-expansion-panel>
            <mat-expansion-panel-header>
                <span style="color:#1d68a5"><i class="material-icons">school</i></span>
              Escolaridade
            </mat-expansion-panel-header>
          </mat-expansion-panel>
          <br />
          <br />
          <button mat-raised-button color="primary" type="submit" (click)="buscar()">
            <i class="material-icons">search</i>Buscar</button>
        </form>
      </div>
    </div>
  </div>
</div>
