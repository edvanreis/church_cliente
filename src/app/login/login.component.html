<div fxLayout="column" fxLayoutAlign="center center" style="height: 700px;">

	<div fxLayout="column" fxLayoutAlign="center center">
		<form [formGroup]="formlogin">
			<div>
				<mat-form-field class="example-full-width">
					<label>Username </label>
					<input matInput formControlName="login" name="login" id="login"
					placeholder="Login" class="ui-inputtext ui-widget">
				</mat-form-field>
			</div>

			<div>
				<mat-form-field class="example-full-width">
					<label>Password</label>
					<input matInput type="password" formControlName="password" autocomplete="off" name="password"
					id="password" placeholder="Senha" class="ui-inputtext ui-widget">
				</mat-form-field>
			</div>

			<div>
				<mat-card-actions>
					<button mat-button full (onClick)="login()">Login</button>
				</mat-card-actions>
			</div>
		</form>

	</div>


</div>
